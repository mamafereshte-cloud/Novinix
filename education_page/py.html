        // ================================================================
        // 🔧 Core Functions
        // ================================================================

        let currentLessonId = 'python-intro';

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            const sections = {};

            lessons.forEach(lesson => {
                if (!sections[lesson.section]) sections[lesson.section] = [];
                sections[lesson.section].push(lesson);
            });

            let html = '';
            for (const [sectionName, items] of Object.entries(sections)) {
                html += `
                    <div class="sidebar-section">
                        <div class="section-title">${sectionName}</div>
                        <ul>
                `;
                items.sort((a, b) => a.order - b.order).forEach(item => {
                    const badge = item.badge ? `<span class="badge ${item.badge}">${item.badge}</span>` : '';
                    html += `
                        <li>
                            <a href="#" data-id="${item.id}" class="${item.id === currentLessonId ? 'active-link' : ''}">
                                ${item.title} ${badge}
                            </a>
                        </li>
                    `;
                });
                html += `</ul></div>`;
            }

            sidebar.innerHTML = html;

            sidebar.querySelectorAll('a[data-id]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const id = this.dataset.id;
                    loadLesson(id);
                    sidebar.querySelectorAll('a[data-id]').forEach(l => l.classList.remove('active-link'));
                    this.classList.add('active-link');
                });
            });
        }

        function loadLesson(id) {
            const lesson = lessons.find(l => l.id === id);
            if (!lesson) return;

            currentLessonId = id;
            document.getElementById('mainContent').innerHTML = lesson.content;

            initTabs();
            renderSidebar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initTabs() {
            document.querySelectorAll('.code-container').forEach(container => {
                const tabs = container.querySelectorAll('.tab');
                const panels = container.querySelectorAll('.code-panel');

                tabs.forEach(tab => {
                    tab.addEventListener('click', function() {
                        const tabName = this.dataset.tab;
                        tabs.forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        panels.forEach(p => p.classList.remove('active'));
                        const target = container.querySelector(`.code-panel[data-panel="${tabName}"]`);
                        if (target) target.classList.add('active');
                    });
                });
            });
        }

        // ================================================================
        // 📋 Copy Code
        // ================================================================

        function copyCode(btn) {
            const container = btn.closest('.code-body');
            const activePanel = container.querySelector('.code-panel.active');
            const pre = activePanel ? activePanel.querySelector('pre') : container.querySelector('pre');
            if (!pre) return;

            const text = pre.textContent;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✅ Copied';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Copy';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                const range = document.createRange();
                range.selectNode(pre);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                btn.textContent = '✅ Copied';
                setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
            });
        }

        // ================================================================
        // 🚀 Initial Load
        // ================================================================

        document.addEventListener('DOMContentLoaded', function() {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="python-hero">
                    <div class="hero-icon">🐍</div>
                    <h2>🐍 آموزش جامع <span>پایتون</span></h2>
                    <p>یادگیری پایتون از مقدماتی تا پیشرفته با مثال‌های عملی</p>
                    <div class="hero-meta">

                    </div>

                    <p style="font-size:1.1rem;">📚 یک درس را از سایدبار سمت راست انتخاب کنید</p>
                    <p style="font-size:0.85rem; margin-top:5px;">دروس: مقدمات (۳ درس) | پیشرفته (۲ درس)</p>
                </div>
            `;

            renderSidebar();
            setTimeout(() => {
                loadLesson('python-intro');
            }, 100);
        });

        console.log('🐍 Python learning system ready!');
    </script>
