<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔢 ۲۰۴۸</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <style>
        .g2048-wrapper { max-width: 480px; }
        #board2048 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px; background:rgba(255,255,255,0.03); border-radius:var(--radius-sm); border:2px solid var(--card-border); aspect-ratio:1; }
        .cell2048 { aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:700; transition:all 0.15s; background:rgba(255,255,255,0.05); color:var(--text-primary); user-select:none; }
        .cell2048[data-v="2"] { background:#eee4da; color:#776e65; }
        .cell2048[data-v="4"] { background:#ede0c8; color:#776e65; }
        .cell2048[data-v="8"] { background:#f2b179; color:#f9f6f2; }
        .cell2048[data-v="16"] { background:#f59563; color:#f9f6f2; }
        .cell2048[data-v="32"] { background:#f67c5f; color:#f9f6f2; }
        .cell2048[data-v="64"] { background:#f65e3b; color:#f9f6f2; }
        .cell2048[data-v="128"] { background:#edcf72; color:#f9f6f2; }
        .cell2048[data-v="256"] { background:#edcc61; color:#f9f6f2; }
        .cell2048[data-v="512"] { background:#edc850; color:#f9f6f2; }
        .cell2048[data-v="1024"] { background:#edc53f; color:#f9f6f2; }
        .cell2048[data-v="2048"] { background:#edc22e; color:#f9f6f2; }
        .cell2048[data-v="4096"] { background:#60d992; color:#f9f6f2; }
        .cell2048[data-v="8192"] { background:#3c9a6e; color:#f9f6f2; }
        .cell2048.pop { animation:pop2048 0.2s ease; }
        @keyframes pop2048 { 0%{transform:scale(0);} 50%{transform:scale(1.2);} 100%{transform:scale(1);} }
        @media (max-width:450px){ .cell2048{font-size:1.5rem;} }
        @media (max-width:350px){ .cell2048{font-size:1.2rem;} #board2048{gap:5px;padding:8px;} }
    </style>
</head>
<body>
<div class="game-wrapper g2048-wrapper">
    <div class="game-header">
        <h1>🔢 ۲۰۴۸</h1>
        <div class="header-buttons"><a href="../pages/games.html" class="exit-btn">✕ خروج</a></div>
    </div>
    <div class="game-info">
        <div class="info-box"><span class="label">🏆 امتیاز</span><span class="value" id="score2048">0</span></div>
        <div class="info-box"><span class="label">🏅 بهترین</span><span class="value" id="best2048">0</span></div>
    </div>
    <div class="status-message" id="status2048">🎮 با کلیدهای جهت‌دار حرکت کنید</div>
    <div class="board-wrapper"><div id="board2048"></div></div>
    <div class="game-buttons">
        <button class="btn btn-danger" id="reset2048">🔄 بازی جدید</button>
        <button class="btn btn-cyan" id="undo2048">↩ لغو</button>
    </div>
    <div class="key-hints"><span>⬆⬇⬅➡ حرکت</span><span>R ریست</span><span>Z لغو</span></div>
</div>
<script>
// ===== ۲۰۴۸ =====
const boardEl=document.getElementById('board2048');
let grid=[], score=0, best=parseInt(localStorage.getItem('g2048Best'))||0, history=[], animating=false, gameEnded=false;
document.getElementById('best2048').textContent=best;

function initGrid(){ gameEnded=false; grid=Array.from({length:4},()=>Array(4).fill(0)); score=0; history=[]; animating=false; addTile(); addTile(); render(); updateScore(); }
function addTile(){ const empty=[]; for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(grid[i][j]===0)empty.push([i,j]); if(empty.length===0)return null; const [r,c]=empty[Math.floor(Math.random()*empty.length)]; grid[r][c]=Math.random()<0.9?2:4; return {row:r,col:c,value:grid[r][c]}; }
function render(anim){ boardEl.innerHTML=''; for(let i=0;i<4;i++)for(let j=0;j<4;j++){ const cell=document.createElement('div'); cell.className='cell2048'; const v=grid[i][j]; cell.dataset.v=v; cell.textContent=v||''; if(anim&&anim.new&&anim.new.row===i&&anim.new.col===j)cell.classList.add('pop'); boardEl.appendChild(cell); } }
function updateScore(){ document.getElementById('score2048').textContent=score; if(score>best){best=score;localStorage.setItem('g2048Best',best);document.getElementById('best2048').textContent=best;} }
function saveState(){ history.push({grid:grid.map(r=>[...r]),score:score}); if(history.length>20)history.shift(); }
function undo(){ if(history.length===0||animating)return; const s=history.pop(); grid=s.grid; score=s.score; render(); updateScore(); }
function getMax(){ let m=0; for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(grid[i][j]>m)m=grid[i][j]; return m; }
async function saveScore2048(){ try{ if(typeof NovinixAuth!=='undefined'&&NovinixAuth.isLoggedIn()){ await NovinixAuth.saveGameScore('2048',score,{max_tile:getMax()}); } }catch(e){} }
function move2048(dir){ if(animating||gameEnded)return; saveState(); let moved=false, newTile=null; const dirs={up:{r:-1,c:0,start:0,end:4,step:1},down:{r:1,c:0,start:3,end:-1,step:-1},left:{r:0,c:-1,start:0,end:4,step:1},right:{r:0,c:1,start:3,end:-1,step:-1}}; const d=dirs[dir]; if(!d)return; const order=[]; for(let i=d.start;i!==d.end;i+=d.step)order.push(i); let merged=[]; for(let i of order){ for(let j of order){ if(dir==='up'||dir==='down'){ const r=i,c=j; if(grid[r][c]===0)continue; let nr=r; while(nr+d.r>=0&&nr+d.r<4&&grid[nr+d.r][c]===0)nr+=d.r; if(nr!==r){grid[nr][c]=grid[r][c];grid[r][c]=0;moved=true;} if(nr+d.r>=0&&nr+d.r<4&&grid[nr+d.r][c]===grid[nr][c]&&!merged.some(m=>m[0]===nr+d.r&&m[1]===c)){ grid[nr+d.r][c]*=2; grid[nr][c]=0; score+=grid[nr+d.r][c]; merged.push([nr+d.r,c]); moved=true; } }else{ const r=j,c=i; if(grid[r][c]===0)continue; let nc=c; while(nc+d.c>=0&&nc+d.c<4&&grid[r][nc+d.c]===0)nc+=d.c; if(nc!==c){grid[r][nc]=grid[r][c];grid[r][c]=0;moved=true;} if(nc+d.c>=0&&nc+d.c<4&&grid[r][nc+d.c]===grid[r][nc]&&!merged.some(m=>m[0]===r&&m[1]===nc+d.c)){ grid[r][nc+d.c]*=2; grid[r][nc]=0; score+=grid[r][nc+d.c]; merged.push([r,nc+d.c]); moved=true; } } } } if(!moved){history.pop();return;} animating=true; const nt=addTile(); render({new:nt}); updateScore(); setTimeout(()=>{animating=false;},250); if(isGameOver()){ setTimeout(()=>{gameEnded=true; saveScore2048(); if(confirm('💀 بازی تمام شد! امتیاز: '+score+'\nدوباره بازی می‌کنید؟'))initGrid(); },300); } for(let i=0;i<4;i++)for(let j=0;j<4;j++){ if(grid[i][j]===2048){ setTimeout(()=>{saveScore2048();alert('🎉 شما به ۲۰۴۸ رسیدید! امتیاز: '+score);},300); return; } } }
function isGameOver(){ for(let i=0;i<4;i++)for(let j=0;j<4;j++){ if(grid[i][j]===0)return false; if(i<3&&grid[i][j]===grid[i+1][j])return false; if(j<3&&grid[i][j]===grid[i][j+1])return false; }return true; }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowUp'){e.preventDefault();move2048('up');} if(e.key==='ArrowDown'){e.preventDefault();move2048('down');} if(e.key==='ArrowLeft'){e.preventDefault();move2048('left');} if(e.key==='ArrowRight'){e.preventDefault();move2048('right');} if(e.key==='r'||e.key==='R')initGrid(); if(e.key==='z'||e.key==='Z')undo(); });
document.getElementById('reset2048').addEventListener('click',initGrid);
document.getElementById('undo2048').addEventListener('click',undo);
initGrid();
</script>
<script src="../assets/js/seo.js"></script>
</body>
</html>
