<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🥚 گرفتن تخم‌مرغ</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <style>
        .egg-wrapper { max-width: 580px; }
        #eggCanvas { display:block; width:100%; height:auto; aspect-ratio:560/400; background:linear-gradient(180deg,#87CEEB,#4a90d9); border-radius:var(--radius-sm); cursor:pointer; border:2px solid var(--card-border); }
        .egg-info { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
        .egg-info .stat { background:var(--card-bg); padding:4px 16px; border-radius:50px; border:1px solid var(--card-border); font-size:0.9rem; }
        .egg-info .stat span { font-weight:700; color:#f1c40f; }
        @media (max-width:500px){ .egg-info .stat{font-size:0.8rem;padding:4px 12px;} }
    </style>
</head>
<body>
<div class="game-wrapper egg-wrapper">
    <div class="game-header">
        <h1>🥚 گرفتن تخم‌مرغ</h1>
        <div class="header-buttons"><a href="../pages/games.html" class="exit-btn">✕ خروج</a></div>
    </div>
    <div class="egg-info">
        <div class="stat">🥚 تخم‌ها: <span id="eggScore">0</span></div>
        <div class="stat">❤️ جان: <span id="eggLives">3</span></div>
        <div class="stat">🏆 بهترین: <span id="eggBest">0</span></div>
    </div>
    <div class="status-message" id="eggStatus">🎮 برای شروع کلیک کنید یا Space</div>
    <canvas id="eggCanvas" width="560" height="400"></canvas>
    <div class="game-buttons">
        <button class="btn btn-success" id="eggStart">▶ شروع بازی</button>
        <button class="btn btn-danger" id="eggReset">🔄 ریست</button>
    </div>
    <div class="key-hints"><span>⬅➡ حرکت سبد</span><span>🖱 ماوس</span><span>␣ شروع</span></div>
</div>
<script>
// ===== گرفتن تخم‌مرغ =====
const canvas=document.getElementById('eggCanvas'), ctx=canvas.getContext('2d');
const W=560,H=400, BW=60, BH=30;
let basket={x:W/2-BW/2,y:H-40}, eggs=[], score=0, lives=3, running=false, frame=0, best=parseInt(localStorage.getItem('catchEggsBest'))||0, keys={}, particles=[], ended=false;
document.getElementById('eggBest').textContent=best;

class Particle { constructor(x,y,color){ this.x=x;this.y=y;this.vx=(Math.random()-0.5)*10;this.vy=-Math.random()*8-2;this.size=3+Math.random()*6;this.color=color||'#f1c40f';this.life=1;this.decay=0.015+Math.random()*0.02;this.gravity=0.2; } update(){this.x+=this.vx;this.vy+=this.gravity;this.y+=this.vy;this.life-=this.decay;this.size*=0.98;} draw(ctx){ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,Math.max(1,this.size),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;} isDead(){return this.life<=0||this.size<0.5;} }

function spawnExplosion(x,y){ const colors=['#f1c40f','#f39c12','#e67e22','#ffd700','#fff']; for(let i=0;i<25;i++)particles.push(new Particle(x,y,colors[Math.floor(Math.random()*colors.length)])); }
function spawnSplat(x,y){ const colors=['#f1c40f','#f39c12','#e67e22']; for(let i=0;i<15;i++){const p=new Particle(x,y,colors[Math.floor(Math.random()*colors.length)]);p.vy=(Math.random()-0.5)*4;p.vx=(Math.random()-0.5)*4;p.gravity=0.1;p.decay=0.02+Math.random()*0.02;particles.push(p);} }
function spawnEgg(){ const x=20+Math.random()*(W-40); const size=14+Math.random()*6; eggs.push({x,y:-20,size,speed:1.5+Math.random()*2.5,cracked:false,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.05}); }
function updateEggs(){ for(let i=eggs.length-1;i>=0;i--){ const e=eggs[i]; e.y+=e.speed; e.rotation+=e.rotSpeed; const cx=e.x, cy=e.y, r=e.size; const bx=basket.x, by=basket.y; let collided=false; if(cy+r>by&&cy-r<by+10&&cx>bx+5&&cx<bx+BW-5){ score++; collided=true; spawnExplosion(e.x,e.y); }else if(cy+r>by&&cy-r<by+BH){ if(cx+r>bx&&cx-r<bx+5){lives--;collided=true;spawnSplat(e.x,e.y);if(lives<=0)endEgg();}else if(cx-r<bx+BW&&cx+r>bx+BW-5){lives--;collided=true;spawnSplat(e.x,e.y);if(lives<=0)endEgg();}else if(cy-r<by+BH&&cy+r>by+BH-2&&cx>bx&&cx<bx+BW){lives--;collided=true;spawnSplat(e.x,e.y);if(lives<=0)endEgg();} } if(collided){eggs.splice(i,1);updateEggDisplay();continue;} if(e.y+e.size>H+20){lives--;spawnSplat(e.x,H-10);eggs.splice(i,1);updateEggDisplay();if(lives<=0)endEgg();continue;} if(e.y+e.size>H-5){lives--;spawnSplat(e.x,H-10);eggs.splice(i,1);updateEggDisplay();if(lives<=0)endEgg();} } for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].isDead())particles.splice(i,1);} }
function updateEggDisplay(){ document.getElementById('eggScore').textContent=score; document.getElementById('eggLives').textContent=lives; }
async function saveEggScore(){ try{ if(typeof NovinixAuth!=='undefined'&&NovinixAuth.isLoggedIn()){ await NovinixAuth.saveGameScore('catch-eggs',score); } }catch(e){} }
function endEgg(){ if(ended)return; ended=true; running=false; document.getElementById('eggStart').textContent='▶ شروع مجدد'; saveEggScore(); if(score>best){best=score;localStorage.setItem('catchEggsBest',best);document.getElementById('eggBest').textContent=best;} }
function startEgg(){ ended=false; eggs=[]; particles=[]; score=0; lives=3; frame=0; running=true; document.getElementById('eggStart').textContent='⏳ بازی'; basket.x=W/2-BW/2; updateEggDisplay(); }
function resetEgg(){ ended=false; eggs=[]; particles=[]; score=0; lives=3; running=false; document.getElementById('eggStart').textContent='▶ شروع بازی'; basket.x=W/2-BW/2; updateEggDisplay(); drawEgg(); }
function drawEgg(){ ctx.clearRect(0,0,W,H); const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#87CEEB');g.addColorStop(0.5,'#5ba3d9');g.addColorStop(1,'#2d7db8'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.fillStyle='rgba(255,255,255,0.2)'; for(let i=0;i<4;i++){const x=(i*150+frame*0.3)%700-100;ctx.beginPath();ctx.arc(x,30+i*20,25,0,Math.PI*2);ctx.arc(x+30,20+i*20,20,0,Math.PI*2);ctx.fill();} particles.forEach(p=>p.draw(ctx)); eggs.forEach(e=>{ ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.rotation); ctx.shadowColor='rgba(0,0,0,0.15)';ctx.shadowBlur=8;ctx.shadowOffsetY=3; const g2=ctx.createRadialGradient(-3,-4,2,0,0,e.size*1.3); g2.addColorStop(0,'#fff8f0');g2.addColorStop(0.5,'#f5f0e0');g2.addColorStop(0.8,'#e8ddd0');g2.addColorStop(1,'#d4c8b8'); ctx.fillStyle=g2; ctx.beginPath();ctx.ellipse(0,0,e.size,e.size*1.35,0,0,Math.PI*2);ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath();ctx.ellipse(-3,-e.size*0.4,e.size*0.3,e.size*0.2,-0.3,0,Math.PI*2);ctx.fill(); ctx.restore(); }); ctx.shadowColor='rgba(0,0,0,0.2)';ctx.shadowBlur=12;ctx.shadowOffsetY=3; const bg=ctx.createLinearGradient(basket.x,basket.y,basket.x,basket.y+BH); bg.addColorStop(0,'#c49a6c');bg.addColorStop(0.5,'#b8895a');bg.addColorStop(1,'#8b6b4a'); ctx.fillStyle=bg; ctx.beginPath();ctx.roundRect(basket.x,basket.y,BW,BH,4);ctx.fill(); ctx.fillStyle='#d4aa7a'; ctx.beginPath();ctx.roundRect(basket.x-4,basket.y-6,BW+8,10,5);ctx.fill(); ctx.shadowBlur=0; if(!running&&(lives<=0||score>0)){ ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H); ctx.fillStyle='#ff6b6b';ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.textBaseline='middle'; ctx.fillText(lives<=0?'💀 Game Over':'⏸ توقف',W/2,H/2-20); ctx.fillStyle='#f1c40f';ctx.font='20px Arial'; ctx.fillText(`امتیاز: ${score}`,W/2,H/2+40); } ctx.shadowBlur=0; }
function eggLoop(){ if(running){ frame++; if(frame%Math.max(25,75-Math.floor(score/20))===0){spawnEgg();if(Math.random()<0.25&&score>30)spawnEgg();} if(keys['ArrowLeft']&&basket.x>0)basket.x-=6; if(keys['ArrowRight']&&basket.x<W-BW)basket.x+=6; updateEggs(); } drawEgg(); requestAnimationFrame(eggLoop); }
canvas.addEventListener('mousemove',e=>{ const rect=canvas.getBoundingClientRect(); const sx=canvas.width/rect.width; const x=(e.clientX-rect.left)*sx-BW/2; basket.x=Math.max(0,Math.min(W-BW,x)); });
canvas.addEventListener('click',()=>{if(!running&&lives>0)startEgg();});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width;const x=(t.clientX-rect.left)*sx-BW/2;basket.x=Math.max(0,Math.min(W-BW,x));});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(!running&&lives>0)startEgg();});
document.getElementById('eggStart').addEventListener('click',()=>{if(!running)startEgg();});
document.getElementById('eggReset').addEventListener('click',resetEgg);
document.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key===' '||e.key==='Space'){e.preventDefault();if(!running&&lives>0)startEgg();} if(e.key==='r'||e.key==='R')resetEgg(); });
document.addEventListener('keyup',e=>{ keys[e.key]=false; });
if(!CanvasRenderingContext2D.prototype.roundRect){ CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){ if(r>w/2)r=w/2; if(r>h/2)r=h/2; this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);return this;}; }
resetEgg(); eggLoop();
</script>
<script src="../assets/js/seo.js"></script>
</body>
</html>
