<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍉 برش میوه</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <style>
        .fruit-wrapper { max-width: 580px; }
        #fruitCanvas { display:block; width:100%; height:auto; aspect-ratio:560/400; background:linear-gradient(180deg,#1a2a3a,#0d1117); border-radius:var(--radius-sm); cursor:crosshair; border:2px solid var(--card-border); }
        .fruit-info { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
        .fruit-info .stat { background:var(--card-bg); padding:4px 16px; border-radius:50px; border:1px solid var(--card-border); font-size:0.9rem; }
        .fruit-info .stat span { font-weight:700; }
        .fruit-info .stat .score-c { color:#f1c40f; }
        .fruit-info .stat .lives-c { color:#ff6b6b; }
        .fruit-info .stat .best-c { color:#2ecc71; }
        @media (max-width:500px){ .fruit-info .stat{font-size:0.8rem;padding:4px 12px;} }
    </style>
</head>
<body>
<div class="game-wrapper fruit-wrapper">
    <div class="game-header">
        <h1>🍉 برش میوه</h1>
        <div class="header-buttons"><a href="../pages/games.html" class="exit-btn">✕ خروج</a></div>
    </div>
    <div class="fruit-info">
        <div class="stat">🍎 امتیاز: <span class="score-c" id="fScore">0</span></div>
        <div class="stat">❤️ جان: <span class="lives-c" id="fLives">3</span></div>
        <div class="stat">🏆 بهترین: <span class="best-c" id="fBest">0</span></div>
    </div>
    <div class="status-message" id="fStatus">🎮 برای شروع کلیک کنید یا Space</div>
    <canvas id="fruitCanvas" width="560" height="400"></canvas>
    <div class="game-buttons">
        <button class="btn btn-success" id="fStart">▶ شروع بازی</button>
        <button class="btn btn-danger" id="fReset">🔄 ریست</button>
    </div>
    <div class="key-hints"><span>🖱 کلیک و بکشید = برش</span><span>␣ شروع/توقف</span><span>💣 از بمب‌ها دوری کنید!</span></div>
</div>
<script>
// ===== برش میوه =====
const canvas=document.getElementById('fruitCanvas'), ctx=canvas.getContext('2d');
const W=560,H=400, FRUITS=['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🍑','🍒','🥝','🫐'];
const SIZES={'🍎':32,'🍐':34,'🍊':30,'🍋':28,'🍌':36,'🍉':38,'🍇':30,'🍓':32,'🍑':34,'🍒':28,'🥝':32,'🫐':28};
let fruits=[], score=0, lives=3, running=false, frame=0, best=parseInt(localStorage.getItem('fruitNinjaBest'))||0;
let mx=0,my=0,isDown=false,trail=[], particles=[], ended=false;
document.getElementById('fBest').textContent=best;

class Particle { constructor(x,y,color,size=6){ this.x=x;this.y=y;this.vx=(Math.random()-0.5)*12;this.vy=-Math.random()*10-3;this.size=size+Math.random()*4;this.color=color;this.life=1;this.decay=0.01+Math.random()*0.02;this.gravity=0.25;this.rotation=Math.random()*Math.PI*2;this.rotSpeed=(Math.random()-0.5)*0.1; } update(){this.x+=this.vx;this.vy+=this.gravity;this.y+=this.vy;this.life-=this.decay;this.rotation+=this.rotSpeed;this.size*=0.98;} draw(ctx){ctx.globalAlpha=this.life;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation);ctx.fillStyle=this.color;ctx.shadowColor='rgba(255,200,0,0.2)';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,Math.max(1,this.size),0,Math.PI*2);ctx.fill();ctx.restore();ctx.globalAlpha=1;} isDead(){return this.life<=0||this.size<0.5;} }
function spawnExplosion(x,y,color){for(let i=0;i<20;i++)particles.push(new Particle(x,y,color,4+Math.random()*6));}
function spawnBombExplosion(x,y){for(let i=0;i<40;i++){const colors=['#ff6b6b','#ff4444','#ff0000','#ff8800','#ffaa00'];const p=new Particle(x,y,colors[Math.floor(Math.random()*colors.length)],8+Math.random()*10);p.vx=(Math.random()-0.5)*20;p.vy=-Math.random()*15-5;particles.push(p);} for(let i=0;i<20;i++){const p=new Particle(x,y,'#888',15+Math.random()*20);p.vx=(Math.random()-0.5)*8;p.vy=-Math.random()*5-2;p.decay=0.005+Math.random()*0.01;p.gravity=-0.05;particles.push(p);} }
function spawnFruit(){const em=FRUITS[Math.floor(Math.random()*FRUITS.length)];const s=SIZES[em]||30;const x=30+Math.random()*(W-60);fruits.push({x,y:H+20,vx:(Math.random()-0.5)*5,vy:-(7+Math.random()*5),emoji:em,size:s,rotation:0,rotSpeed:(Math.random()-0.5)*0.08,cut:false,isBomb:false});}
function spawnBomb(){const x=30+Math.random()*(W-60);fruits.push({x,y:H+20,vx:(Math.random()-0.5)*5,vy:-(8+Math.random()*4),emoji:'💣',size:32,rotation:0,rotSpeed:(Math.random()-0.5)*0.1,cut:false,isBomb:true});}
function updateFruits(){for(let i=fruits.length-1;i>=0;i--){const f=fruits[i];f.x+=f.vx;f.vy+=0.25;f.y+=f.vy;f.rotation+=f.rotSpeed;if(f.y>H+30){if(!f.cut&&!f.isBomb){lives--;updateFruitDisplay();if(lives<=0)endFruit();}fruits.splice(i,1);}} for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].isDead())particles.splice(i,1);} }
function checkCut(x,y){for(const f of fruits){if(f.cut)continue;const dist=Math.sqrt((x-f.x)**2+(y-f.y)**2);if(dist<f.size+15){if(f.isBomb){spawnBombExplosion(f.x,f.y);f.cut=true;endFruit();return;}f.cut=true;score+=10+Math.floor(Math.random()*5);spawnExplosion(f.x,f.y,'#f1c40f');for(let j=0;j<4;j++){const p=new Particle(f.x+(Math.random()-0.5)*20,f.y+(Math.random()-0.5)*20,'#ff6b6b',3+Math.random()*4);p.vx=(Math.random()-0.5)*8;p.vy=-Math.random()*8-2;particles.push(p);} setTimeout(()=>{const idx=fruits.indexOf(f);if(idx>-1)fruits.splice(idx,1);},150);updateFruitDisplay();}}}
function updateFruitDisplay(){document.getElementById('fScore').textContent=score;document.getElementById('fLives').textContent=lives;}
async function saveFruit(){try{if(typeof NovinixAuth!=='undefined'&&NovinixAuth.isLoggedIn()){await NovinixAuth.saveGameScore('fruit-ninja',score,{lives});}}catch(e){}}
function endFruit(){if(ended)return;ended=true;running=false;document.getElementById('fStart').textContent='▶ شروع مجدد';saveFruit();if(score>best){best=score;localStorage.setItem('fruitNinjaBest',best);document.getElementById('fBest').textContent=best;}}
function startFruit(){ended=false;fruits=[];particles=[];score=0;lives=3;frame=0;running=true;document.getElementById('fStart').textContent='⏳ بازی';updateFruitDisplay();}
function resetFruit(){ended=false;fruits=[];particles=[];score=0;lives=3;running=false;document.getElementById('fStart').textContent='▶ شروع بازی';updateFruitDisplay();drawFruit();}
function drawFruit(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2a3a');g.addColorStop(1,'#0d1117');ctx.fillStyle=g;ctx.fillRect(0,0,W,H); if(isDown&&trail.length>1){ctx.shadowColor='rgba(255,255,255,0.2)';ctx.shadowBlur=15;ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);for(let i=1;i<trail.length;i++)ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();ctx.shadowBlur=30;ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);for(let i=1;i<trail.length;i++)ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();ctx.shadowBlur=0;} particles.forEach(p=>p.draw(ctx)); fruits.forEach(f=>{ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rotation);if(f.isBomb){ctx.shadowColor='rgba(255,0,0,0.3)';ctx.shadowBlur=20+Math.sin(frame*0.1)*5;}else{ctx.shadowColor='rgba(255,200,0,0.1)';ctx.shadowBlur=10;} ctx.font=f.size+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';if(f.cut){ctx.globalAlpha=0.3;ctx.font=(f.size*0.4)+'px Arial';ctx.fillText(f.emoji,-8,-4);ctx.fillText(f.emoji,8,4);}else{ctx.fillText(f.emoji,0,0);}ctx.restore();}); if(!running&&(lives<=0||score>0)){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle=lives<=0?'#ff6b6b':'#8b949e';ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lives<=0?'💥 Game Over':'⏸ توقف',W/2,H/2-30);ctx.fillStyle='#f1c40f';ctx.font='22px Arial';ctx.fillText(`امتیاز: ${score}`,W/2,H/2+30);if(lives<=0){ctx.fillStyle='#ff6b6b';ctx.font='16px Arial';ctx.fillText('💣 به بمب برخورد کردید!',W/2,H/2+75);}} }
function fruitLoop(){if(running){frame++;const rate=Math.max(20,50-Math.floor(score/30));if(frame%Math.floor(rate)===0){spawnFruit();if(Math.random()<0.2&&score>10)spawnFruit();if(Math.random()<0.12+Math.min(0.08,score/500)&&score>15)spawnBomb();}updateFruits();}drawFruit();requestAnimationFrame(fruitLoop);}
canvas.addEventListener('mousedown',e=>{const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;mx=(e.clientX-rect.left)*sx;my=(e.clientY-rect.top)*sy;isDown=true;trail=[{x:mx,y:my}];});
canvas.addEventListener('mousemove',e=>{const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;mx=(e.clientX-rect.left)*sx;my=(e.clientY-rect.top)*sy;if(isDown&&running){trail.push({x:mx,y:my});if(trail.length>25)trail.shift();checkCut(mx,my);}});
canvas.addEventListener('mouseup',()=>{isDown=false;trail=[];});
canvas.addEventListener('mouseleave',()=>{isDown=false;trail=[];});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;mx=(t.clientX-rect.left)*sx;my=(t.clientY-rect.top)*sy;isDown=true;trail=[{x:mx,y:my}];});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;mx=(t.clientX-rect.left)*sx;my=(t.clientY-rect.top)*sy;if(isDown&&running){trail.push({x:mx,y:my});if(trail.length>25)trail.shift();checkCut(mx,my);}});
canvas.addEventListener('touchend',()=>{isDown=false;trail=[];});
document.getElementById('fStart').addEventListener('click',()=>{if(!running)startFruit();});
document.getElementById('fReset').addEventListener('click',resetFruit);
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Space'){e.preventDefault();if(!running)startFruit();}if(e.key==='r'||e.key==='R')resetFruit();});
resetFruit(); fruitLoop();
</script>
<script src="../assets/js/seo.js"></script>
</body>
</html>
