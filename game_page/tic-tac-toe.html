<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❌ دوز</title>
    <link rel="stylesheet" href="../assets/css/game.css">
    <style>
        .ttt-wrapper { max-width: 480px; }
        .ttt-board { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; background:var(--card-bg); padding:10px; border-radius:var(--radius-sm); border:2px solid var(--card-border); aspect-ratio:1; max-width:400px; margin:0 auto; }
        .ttt-cell { background:rgba(255,255,255,0.03); border:2px solid var(--card-border); border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:4rem; font-weight:700; cursor:pointer; transition:all 0.2s; aspect-ratio:1; user-select:none; }
        .ttt-cell:hover:not(.taken):not(.game-over) { background:rgba(255,255,255,0.08); transform:scale(1.02); }
        .ttt-cell.taken { cursor:default; }
        .ttt-cell.win-cell { animation:winPulse 0.8s ease-in-out infinite; }
        .ttt-cell .x { color:#ff6b6b; text-shadow:0 0 30px rgba(255,107,107,0.3); }
        .ttt-cell .o { color:#58a6ff; text-shadow:0 0 30px rgba(88,166,255,0.3); }
        @keyframes winPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);background:rgba(241,196,15,0.1);} }
        .ttt-score { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px; }
        .ttt-score .info-box .value#sX { color:#ff6b6b; }
        .ttt-score .info-box .value#sO { color:#58a6ff; }
        .ttt-score .info-box .value#sD { color:#f1c40f; }
        .ttt-cell.game-over { cursor:default; }
        @media (max-width:450px){ .ttt-cell{font-size:2.8rem;} }
        @media (max-width:380px){ .ttt-cell{font-size:2.2rem;} }
    </style>
</head>
<body>
<div class="game-wrapper ttt-wrapper">
    <div class="game-header">
        <h1>❌ دوز</h1>
        <div class="header-buttons"><a href="../pages/games.html" class="exit-btn">✕ خروج</a></div>
    </div>
    <div class="ttt-score">
        <div class="info-box"><span class="label">❌ X</span><span class="value" id="sX">0</span></div>
        <div class="info-box"><span class="label">🤝 مساوی</span><span class="value" id="sD">0</span></div>
        <div class="info-box"><span class="label">⭕ O</span><span class="value" id="sO">0</span></div>
    </div>
    <div class="status-message" id="statusMsg">🎮 نوبت بازیکن <span id="curP">X</span></div>
    <div class="board-wrapper"><div class="ttt-board" id="board"></div></div>
    <div class="game-buttons">
        <button class="btn btn-success" onclick="resetGame()">🔄 بازی جدید</button>
        <button class="btn btn-purple" onclick="toggleMode()" id="modeBtn">🤖 کامپیوتر</button>
    </div>
    <div class="key-hints"><span>🖱 کلیک = انتخاب</span><span>R = ریستارت</span></div>
</div>
<script>
// ===== دوز =====
let state=['','','','','','','','',''], cur='X', active=true, isAi=false, scores={X:0,O:0,draw:0}, winPatterns=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const boardEl=document.getElementById('board'), statusMsg=document.getElementById('statusMsg'), curP=document.getElementById('curP');

function initBoard(){ boardEl.innerHTML=''; for(let i=0;i<9;i++){ const cell=document.createElement('div'); cell.className='ttt-cell'; cell.dataset.index=i; cell.addEventListener('click',()=>handleClick(i)); boardEl.appendChild(cell); } }
function handleClick(idx){ if(!active||state[idx]!=='')return; if(isAi&&cur==='O')return; makeMove(idx); }
function makeMove(idx){ state[idx]=cur; renderCell(idx); const w=checkWinner(); if(w){endGame(w);return;} if(state.every(c=>c!=='')){endGame('draw');return;} switchPlayer(); if(isAi&&cur==='O'&&active)setTimeout(aiMove,300); }
function renderCell(idx){ const cell=boardEl.children[idx]; cell.classList.add('taken'); if(state[idx]==='X'){cell.innerHTML='<span class="x">✕</span>';}else{cell.innerHTML='<span class="o">◯</span>';} }
function switchPlayer(){ cur=cur==='X'?'O':'X'; curP.textContent=cur; curP.style.color=cur==='X'?'#ff6b6b':'#58a6ff'; statusMsg.innerHTML=`🎮 نوبت بازیکن <span style="color:${cur==='X'?'#ff6b6b':'#58a6ff'}">${cur}</span>`; }
function checkWinner(){ for(const p of winPatterns){ const [a,b,c]=p; if(state[a]&&state[a]===state[b]&&state[a]===state[c])return {winner:state[a],pattern:p}; }return null; }
function endGame(r){ active=false; if(r==='draw'){scores.draw++;document.getElementById('sD').textContent=scores.draw;statusMsg.textContent='🤝 بازی مساوی شد!';statusMsg.className='status-message warning';return;} const w=r.winner; scores[w]++; document.getElementById(`s${w}`).textContent=scores[w]; statusMsg.textContent=`🎉 بازیکن ${w} برنده شد!`; statusMsg.className='status-message success'; r.pattern.forEach(i=>boardEl.children[i].classList.add('win-cell')); saveScore(w); }
async function saveScore(winner){ try{ if(typeof NovinixAuth!=='undefined'&&NovinixAuth.isLoggedIn()){ await NovinixAuth.saveGameScore('tic-tac-toe',10,{winner}); } }catch(e){} }
function resetGame(){ state=['','','','','','','','','']; active=true; cur='X'; boardEl.querySelectorAll('.ttt-cell').forEach(c=>{c.className='ttt-cell';c.textContent='';}); statusMsg.className='status-message'; curP.textContent='X'; curP.style.color='#ff6b6b'; statusMsg.innerHTML='🎮 نوبت بازیکن <span style="color:#ff6b6b">X</span>'; if(isAi&&cur==='O')setTimeout(aiMove,400); }
function aiMove(){ if(!active||cur!=='O')return; const best=getBestMove(); if(best!==null)makeMove(best); }
function getBestMove(){ for(let i=0;i<9;i++){if(state[i]===''){state[i]='O';if(checkWinner()){state[i]='';return i;}state[i]='';}} for(let i=0;i<9;i++){if(state[i]===''){state[i]='X';if(checkWinner()){state[i]='';return i;}state[i]='';}} if(state[4]==='')return 4; const corners=[0,2,6,8]; for(const c of shuffle(corners))if(state[c]==='')return c; const edges=[1,3,5,7]; for(const e of shuffle(edges))if(state[e]==='')return e; return null; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr; }
function toggleMode(){ isAi=!isAi; document.getElementById('modeBtn').textContent=isAi?'👥 دو نفره':'🤖 کامپیوتر'; resetGame(); }
document.addEventListener('keydown',e=>{ if(e.key==='r'||e.key==='R')resetGame(); });
initBoard(); resetGame();
</script>
<script src="../assets/js/seo.js"></script>
</body>
</html>
