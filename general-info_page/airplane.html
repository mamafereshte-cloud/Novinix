            text-align: center;

        }

            content: '✈️';

            opacity: 0.05;
            right: -30px;
            bottom: -30px;

            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        .airplanes-hero h2 span {
            color: #f1c40f;
        }

            position: relative;
            z-index: 1;

            margin: 0 auto;

            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #a0b4c8;

            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 500;
            user-select: none;
        }
        .cat-tag:hover {
            border-color: #00ffcc;

        }
        .cat-tag.active {

            border-color: #00ffcc;
        }

            margin-top: 10px;
        }

            box-shadow: 0 12px 40px rgba(0, 255, 204, 0.1);
        }

            font-weight: 700;
            color: #e8f5f0;
        }

            font-weight: 400;
            color: #a0b4c8;
            display: block;

        .airplane-card:nth-child(4) { animation-delay: 0.12s; }
        .airplane-card:nth-child(5) { animation-delay: 0.15s; }
        .airplane-card:nth-child(6) { animation-delay: 0.18s; }
        .airplane-card:nth-child(7) { animation-delay: 0.21s; }
        .airplane-card:nth-child(8) { animation-delay: 0.24s; }
        .airplane-card:nth-child(9) { animation-delay: 0.27s; }
        .airplane-card:nth-child(10) { animation-delay: 0.30s; }
        .airplane-card:nth-child(11) { animation-delay: 0.33s; }
        .airplane-card:nth-child(12) { animation-delay: 0.36s; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #a0b4c8;
            display: none;
        }

            font-size: 4rem;

        function renderAirplanes(data, filterCategory = 'all') {
            const grid = document.getElementById('airplaneGrid');
            const noResults = document.getElementById('noResults');
            let html = '';
            let count = 0;

            data.forEach(item => {
                if (filterCategory !== 'all' && item.category !== filterCategory) return;
                count++;
                const imagePath = `airplanes_ph/${item.image}`;
                const catLabels = { commercial: '🛫 مسافربری', military: '⚔️ جنگی', private: '🛩️ خصوصی', cargo: '📦 باری', historic: '🕰️ تاریخی', supersonic: '💨 مافوق صوت', business: '👔 تجاری' };
                const catClasses = { commercial: 'commercial', military: 'military', private: 'private', cargo: 'cargo', historic: 'historic', supersonic: 'supersonic', business: 'business' };

                html += `
                    <div class="airplane-card" data-category="${item.category}">
                        <div class="airplane-image">
                            <img src="${imagePath}" alt="${item.nameFa}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                            <span class="emoji-placeholder" style="display:none;">${item.emoji || '✈️'}</span>
                        </div>
                        <div class="airplane-header">
                            <div>
                                <div class="airplane-name">${item.nameFa}</div>
                                <span class="airplane-name-en">${item.nameEn}</span>
                            </div>
                            <span class="category-badge ${catClasses[item.category]}">${catLabels[item.category]}</span>
                        </div>
                        <div class="airplane-description">${item.description.map(p => `<p>${p}</p>`).join('')}</div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            if (count === 0) noResults.style.display = 'block';
            else noResults.style.display = 'none';

            const cards = grid.querySelectorAll('.airplane-card');
            cards.forEach((card, index) => {
                card.style.animation = 'none';
                card.offsetHeight;
                card.style.animation = `fadeInUp 0.5s ease forwards`;
                card.style.animationDelay = `${(index % 12) * 0.03 + 0.03}s`;
            });
        }

        document.querySelectorAll('.cat-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderAirplanes(airplanesData, this.dataset.cat);
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderAirplanes(airplanesData, 'all');
        });
    </script>
