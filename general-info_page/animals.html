<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پستانداران | نوینیکس</title>
    <meta name="description" content="معرفی و اطلاعات کامل انواع پستانداران از خشکی تا دریا، قطبی و بیابان" />
    <link rel="canonical" href="https://novinix.ir/pages/general-info/animals.html" />
    <link rel="icon" href="../assets/images/logo.ico" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <style>
        .animals-hero {
            background: linear-gradient(135deg, #1a1a2e, #2d1b69, #6c2eb7);
            color: white;
            padding: 40px 30px;
            border-radius: 20px;
            margin-bottom: 35px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(108, 46, 183, 0.3);
            position: relative;
            overflow: hidden;
        }
        .animals-hero::before { content: '🦁'; position: absolute; font-size: 10rem; opacity: 0.05; right: -30px; bottom: -30px; transform: rotate(10deg); }
        .animals-hero h2 { font-size: 2rem; margin-bottom: 10px; position: relative; z-index: 1; }
        .animals-hero h2 span { color: #ffd93d; }
        .animals-hero p { opacity: 0.85; font-size: 1.05rem; position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }
        .category-filter { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .cat-tag { background: rgba(255, 255, 255, 0.05); padding: 8px 20px; border-radius: 30px; font-size: 0.85rem; color: #a0b4c8; cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.06); font-weight: 500; user-select: none; }
        .cat-tag:hover { border-color: #00ffcc; transform: translateY(-2px); color: #00ffcc; }
        .cat-tag.active { background: linear-gradient(135deg, #00ffcc, #00b4db); color: #0f0c29; border-color: #00ffcc; }
        .animal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 10px; }
        .animal-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 18px; padding: 20px; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
        .animal-card:hover { transform: translateY(-5px); border-color: #00ffcc; box-shadow: 0 12px 40px rgba(0, 255, 204, 0.1); }
        .animal-card .animal-image { width: 100%; height: 200px; border-radius: 12px; overflow: hidden; margin-bottom: 15px; background: rgba(255, 255, 255, 0.03); display: flex; align-items: center; justify-content: center; position: relative; }
        .animal-card .animal-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .animal-card:hover .animal-image img { transform: scale(1.05); }
        .animal-card .animal-image .emoji-placeholder { font-size: 4rem; opacity: 0.3; }
        .animal-card .animal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .animal-card .animal-name { font-size: 1.2rem; font-weight: 700; color: #e8f5f0; }
        .animal-card .animal-name-en { font-size: 0.9rem; font-weight: 400; color: #a0b4c8; display: block; }
        .animal-card .category-badge { font-size: 0.6rem; padding: 3px 12px; border-radius: 20px; font-weight: 700; white-space: nowrap; margin-top: 2px; }
        .category-badge.land { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .category-badge.sea { background: rgba(52, 152, 219, 0.2); color: #3498db; }
        .category-badge.air { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }
        .category-badge.polar { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
        .category-badge.desert { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .category-badge.freshwater { background: rgba(26, 188, 156, 0.2); color: #1abc9c; }
        .animal-card .animal-description { font-size: 0.85rem; color: #a0b4c8; line-height: 1.6; flex-grow: 1; }
        .animal-card .animal-description p { margin-bottom: 6px; }
        .animal-card .animal-description p:last-child { margin-bottom: 0; }
        .animal-card { opacity: 0; animation: fadeInUp 0.5s ease forwards; }
        .animal-card:nth-child(1) { animation-delay: 0.03s; }
        .animal-card:nth-child(2) { animation-delay: 0.06s; }
        .animal-card:nth-child(3) { animation-delay: 0.09s; }
        .animal-card:nth-child(4) { animation-delay: 0.12s; }
        .animal-card:nth-child(5) { animation-delay: 0.15s; }
        .animal-card:nth-child(6) { animation-delay: 0.18s; }
        .animal-card:nth-child(7) { animation-delay: 0.21s; }
        .animal-card:nth-child(8) { animation-delay: 0.24s; }
        .animal-card:nth-child(9) { animation-delay: 0.27s; }
        .animal-card:nth-child(10) { animation-delay: 0.30s; }
        .animal-card:nth-child(11) { animation-delay: 0.33s; }
        .animal-card:nth-child(12) { animation-delay: 0.36s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .no-results { text-align: center; padding: 50px 20px; color: #a0b4c8; display: none; }
        .no-results .big-icon { font-size: 4rem; display: block; margin-bottom: 15px; }
        .no-results h3 { color: #e8f5f0; margin-bottom: 5px; }
        @media (max-width: 768px) {
            .animals-hero { padding: 25px 20px; }
            .animals-hero h2 { font-size: 1.5rem; }
            .animal-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .animal-card .animal-image { height: 150px; }
            .cat-tag { font-size: 0.75rem; padding: 6px 14px; }
        }
        @media (max-width: 480px) {
            .animal-grid { grid-template-columns: 1fr; }
            .animal-card .animal-image { height: 180px; }
            .animal-card .animal-name { font-size: 1rem; }
            .animals-hero h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <header id="mainHeader"></header>

    <main>
        <div class="animals-hero">
            <h2>🦁 پستانداران <span>جهان</span></h2>
            <p>دنیای شگفت‌انگیز پستانداران از خشکی تا دریا</p>
        </div>

        <div class="category-filter">
            <span class="cat-tag active" data-cat="all">همه</span>
            <span class="cat-tag" data-cat="land">🏞️ خشکی</span>
            <span class="cat-tag" data-cat="sea">🌊 دریایی</span>
            <span class="cat-tag" data-cat="air">🦇 پرنده‌وار</span>
            <span class="cat-tag" data-cat="freshwater">🏞️ آب شیرین</span>
            <span class="cat-tag" data-cat="polar">❄️ قطبی</span>
            <span class="cat-tag" data-cat="desert">🏜️ بیابان</span>
        </div>

        <div class="animal-grid" id="animalGrid"></div>

        <div class="no-results" id="noResults">
            <span class="big-icon">🔍</span>
            <h3>نتیجه‌ای یافت نشد</h3>
            <p>در دسته‌بندی انتخاب شده پستانداری وجود ندارد</p>
        </div>
    </main>

    <footer id="mainFooter"></footer>

    <script src="../auth/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/seo.js"></script>

    <script>
        const mammalsData = [
            { id: 'lion', nameFa: 'شیر', nameEn: 'Lion', category: 'land', image: 'lion.jpg', emoji: '🦁', description: ['شیر یکی از بزرگ‌ترین گربه‌سانان و پادشاه جنگل‌های آفریقا است.', 'شیرها به صورت گروهی زندگی می‌کنند و شکارچیان ماهری هستند.'] },
            { id: 'tiger', nameFa: 'ببر', nameEn: 'Tiger', category: 'land', image: 'tiger.jpg', emoji: '🐯', description: ['ببر بزرگ‌ترین گربه‌سان جهان و نماد قدرت و زیبایی است.', 'نوارهای سیاه روی بدن نارنجی، هر ببر را منحصر‌به‌فرد می‌کند.'] },
            { id: 'elephant', nameFa: 'فیل', nameEn: 'Elephant', category: 'land', image: 'elephant.jpg', emoji: '🐘', description: ['فیل بزرگ‌ترین حیوان خشکی‌زی جهان با خرطوم و عاج‌های بلند است.', 'فیل‌ها روزانه حدود ۱۵۰ کیلوگرم غذا می‌خورند و بسیار مهربان هستند.'] },
            { id: 'leopard', nameFa: 'پلنگ', nameEn: 'Leopard', category: 'land', image: 'leopard.jpg', emoji: '🐆', description: ['پلنگ گربه‌سانی قدرتمند با لکه‌های سیاه روی پوست طلایی است.', 'پلنگ‌ها یکی از موفق‌ترین گربه‌سانان در سازگاری با محیط‌های مختلف هستند.'] },
            { id: 'cheetah', nameFa: 'یوزپلنگ', nameEn: 'Cheetah', category: 'land', image: 'cheetah.jpg', emoji: '🐆', description: ['یوزپلنگ سریع‌ترین حیوان خشکی‌زی با سرعت ۱۲۰ کیلومتر بر ساعت است.', 'یوزپلنگ ایرانی یکی از نادرترین زیرگونه‌ها و در خطر انقراض است.'] },
            { id: 'bear', nameFa: 'خرس', nameEn: 'Bear', category: 'land', image: 'bear.jpg', emoji: '🐻', description: ['خرس یکی از بزرگ‌ترین گوشت‌خواران خشکی با بدنی تنومند و قدرتمند است.', 'خرس‌ها در زمستان به خواب زمستانی می‌روند.'] },
            { id: 'giraffe', nameFa: 'زرافه', nameEn: 'Giraffe', category: 'land', image: 'giraffe.jpg', emoji: '🦒', description: ['زرافه بلندترین حیوان خشکی‌زی با گردن بلند و پاهای بلند است.', 'زرافه‌ها حیوانات آرام و اجتماعی هستند و در گله‌های بزرگ زندگی می‌کنند.'] },
            { id: 'rhino', nameFa: 'کرگدن', nameEn: 'Rhinoceros', category: 'land', image: 'rhino.jpg', emoji: '🦏', description: ['کرگدن یکی از بزرگ‌ترین پستانداران با پوست ضخیم و شاخ روی بینی است.', 'کرگدن‌ها بسیار سریع هستند و با سرعت ۵۰ کیلومتر بر ساعت می‌دوند.'] },
            { id: 'kangaroo', nameFa: 'کانگورو', nameEn: 'Kangaroo', category: 'land', image: 'kangaroo.jpg', emoji: '🦘', description: ['کانگورو یکی از معروف‌ترین پستانداران استرالیا با پاهای قدرتمند و کیسه است.', 'کانگوروها می‌توانند تا ۹ متر بپرند و سرعت ۶۰ کیلومتر بر ساعت برسند.'] },
            { id: 'dolphin', nameFa: 'دلفین', nameEn: 'Dolphin', category: 'sea', image: 'dolphin.jpg', emoji: '🐬', description: ['دلفین یکی از باهوش‌ترین پستانداران دریایی با رفتارهای اجتماعی پیچیده است.', 'دلفین‌ها از صدا برای برقراری ارتباط و پیمایش استفاده می‌کنند.'] },
            { id: 'whale', nameFa: 'نهنگ', nameEn: 'Whale', category: 'sea', image: 'whale.jpg', emoji: '🐋', description: ['نهنگ بزرگ‌ترین پستاندار جهان و یکی از عظیم‌الجثه‌ترین موجودات زمین است.', 'نهنگ آبی بزرگ‌ترین گونه نهنگ با طول ۳۰ متر و وزن ۲۰۰ تن است.'] },
            { id: 'seal', nameFa: 'فک', nameEn: 'Seal', category: 'sea', image: 'seal.jpg', emoji: '🦭', description: ['فک پستانداری دریایی با بدن صاف و باله‌های جلویی است که در آب‌های سرد زندگی می‌کند.', 'فک‌ها می‌توانند تا ۳۰ دقیقه زیر آب بمانند و شناگران بسیار ماهری هستند.'] },
            { id: 'polar_bear', nameFa: 'خرس قطبی', nameEn: 'Polar Bear', category: 'polar', image: 'polar_bear.jpg', emoji: '🐻‍❄️', description: ['خرس قطبی بزرگ‌ترین شکارچی زمینی در مناطق قطبی و نماد یخ‌های شمال است.', 'با تغییرات اقلیمی و ذوب شدن یخ‌ها، خرس‌های قطبی در خطر انقراض قرار دارند.'] },
            { id: 'camel', nameFa: 'شتر', nameEn: 'Camel', category: 'desert', image: 'camel.jpg', emoji: '🐫', description: ['شتر پستانداری با کوهان چربی و توانایی تحمل گرمای شدید بیابان است.', 'شترها با قدم‌هایشان روی شن فرو نمی‌روند و "کشتی بیابان" نامیده می‌شوند.'] },
            { id: 'fennec_fox', nameFa: 'روباه صحرایی', nameEn: 'Fennec Fox', category: 'desert', image: 'fennec_fox.jpg', emoji: '🦊', description: ['روباه صحرایی کوچک‌ترین گونه روباه با گوش‌های بزرگ و مناسب برای گرما است.', 'این حیوان بسیار بازیگوش و باهوش است و به راحتی در شب فعالیت می‌کند.'] },
            { id: 'bat', nameFa: 'خفاش', nameEn: 'Bat', category: 'air', image: 'bat.jpg', emoji: '🦇', description: ['خفاش تنها پستانداری است که می‌تواند پرواز کند و از بال‌های پوستی خود استفاده می‌کند.', 'خفاش‌ها نقش مهمی در گرده‌افشانی و کنترل آفات دارند.'] }
        ];

        function renderAnimals(data, filterCategory = 'all') {
            const grid = document.getElementById('animalGrid');
            const noResults = document.getElementById('noResults');
            let html = '';
            let count = 0;

            data.forEach(item => {
                if (filterCategory !== 'all' && item.category !== filterCategory) return;
                count++;
                const imagePath = `animals_ph/${item.image}`;
                const catLabels = { land: '🏞️ خشکی', sea: '🌊 دریایی', air: '🦇 پرنده‌وار', freshwater: '🏞️ آب شیرین', polar: '❄️ قطبی', desert: '🏜️ بیابان' };
                const catClasses = { land: 'land', sea: 'sea', air: 'air', freshwater: 'freshwater', polar: 'polar', desert: 'desert' };

                html += `
                    <div class="animal-card" data-category="${item.category}">
                        <div class="animal-image">
                            <img src="${imagePath}" alt="${item.nameFa}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                            <span class="emoji-placeholder" style="display:none;">${item.emoji || '🦁'}</span>
                        </div>
                        <div class="animal-header">
                            <div>
                                <div class="animal-name">${item.nameFa}</div>
                                <span class="animal-name-en">${item.nameEn}</span>
                            </div>
                            <span class="category-badge ${catClasses[item.category]}">${catLabels[item.category]}</span>
                        </div>
                        <div class="animal-description">${item.description.map(p => `<p>${p}</p>`).join('')}</div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            if (count === 0) noResults.style.display = 'block';
            else noResults.style.display = 'none';

            const cards = grid.querySelectorAll('.animal-card');
            cards.forEach((card, index) => {
                card.style.animation = 'none';
                card.offsetHeight;
                card.style.animation = `fadeInUp 0.5s ease forwards`;
                card.style.animationDelay = `${(index % 12) * 0.03 + 0.03}s`;
            });
        }

        document.querySelectorAll('.cat-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderAnimals(mammalsData, this.dataset.cat);
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            renderAnimals(mammalsData, 'all');
        });
    </script>
</body>
</html>
