<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محاسبه سن دقیق | نوینیکس</title>
    <meta name="description" content="ابزار حرفه‌ای محاسبه سن بر اساس تاریخ شمسی و میلادی با نمایش برج فلکی و جزئیات کامل." />
    <link rel="canonical" href="https://novinix.ir/online-tools_page/age-calculator" />
    <link rel="icon" href="../assets/images/logo.ico" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/online-tools.css" />
    <style>
        .calendar-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .calendar-toggle button {
            padding: 10px 30px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #a0b4c8;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .calendar-toggle button:hover {
            border-color: rgba(0, 255, 204, 0.2);
            color: #00ffcc;
        }
        .calendar-toggle button.active {
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            color: #0f0c29;
            border-color: #00ffcc;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #a0b4c8;
            margin-bottom: 5px;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #e8f5f0;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.1);
        }
        .form-group select option {
            background: #1a1a2e;
            color: #e8f5f0;
        }
        .btn-calculate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            color: #0f0c29;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 5px;
        }
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 255, 204, 0.25);
        }
        .btn-calculate:active {
            transform: scale(0.97);
        }

        .result-box {
            margin-top: 25px;
            padding: 25px;
            background: rgba(0, 255, 204, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 204, 0.1);
            display: none;
            text-align: center;
        }
        .result-box.visible {
            display: block;
            animation: fadeInUp 0.5s ease forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-box .age-number {
            font-size: 4rem;
            font-weight: 700;
            color: #00ffcc;
            line-height: 1.1;
        }
        .result-box .age-label {
            font-size: 1.1rem;
            color: #a0b4c8;
            margin-bottom: 15px;
        }
        .result-box .age-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .result-box .age-detail {
            text-align: center;
        }
        .result-box .age-detail .number {
            font-size: 1.6rem;
            font-weight: 700;
            color: #00ffcc;
            display: block;
        }
        .result-box .age-detail .label {
            font-size: 0.75rem;
            color: rgba(160, 180, 200, 0.5);
        }
        .result-box .zodiac {
            margin-top: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            color: #fbbf24;
            font-size: 1rem;
        }
        .result-box .next-birthday {
            margin-top: 8px;
            color: rgba(160, 180, 200, 0.5);
            font-size: 0.85rem;
        }

        .tool-wrapper h2 {
            color: #00ffcc;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 8px;
        }
        .tool-wrapper .subtitle {
            color: #a0b4c8;
            text-align: center;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .result-box .age-number {
                font-size: 2.8rem;
            }
            .calendar-toggle button {
                padding: 8px 18px;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .result-box .age-number {
                font-size: 2.2rem;
            }
            .result-box .age-details {
                grid-template-columns: 1fr 1fr;
            }
            .tool-wrapper h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    

    <main>
        <div class="tool-wrapper">
            <h2>📅 محاسبه سن دقیق</h2>
            <p class="subtitle">سن خود را بر اساس تاریخ شمسی یا میلادی به‌طور دقیق محاسبه کنید</p>

            <div class="calendar-toggle" id="calendarToggle">
                <button class="active" data-calendar="shamsi">📅 شمسی</button>
                <button data-calendar="miladi">🌍 میلادی</button>
            </div>

            <form id="ageForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="year">سال</label>
                        <input type="number" id="year" placeholder="۱۴۰۴" min="1300" max="1405" required />
                    </div>
                    <div class="form-group">
                        <label for="month">ماه</label>
                        <select id="month" required>
                            <option value="1">فروردین</option>
                            <option value="2">اردیبهشت</option>
                            <option value="3">خرداد</option>
                            <option value="4">تیر</option>
                            <option value="5">مرداد</option>
                            <option value="6">شهریور</option>
                            <option value="7">مهر</option>
                            <option value="8">آبان</option>
                            <option value="9">آذر</option>
                            <option value="10">دی</option>
                            <option value="11">بهمن</option>
                            <option value="12">اسفند</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="day">روز</label>
                        <input type="number" id="day" placeholder="۱" min="1" max="31" required />
                    </div>
                </div>
                <button type="submit" class="btn-calculate">🧮 محاسبه سن</button>
            </form>

            <div class="result-box" id="resultBox">
                <div class="age-number" id="ageNumber">۲۵</div>
                <div class="age-label" id="ageLabel">سال و ۶ ماه و ۱۲ روز</div>
                <div class="age-details">
                    <div class="age-detail">
                        <span class="number" id="totalDays">۹,۱۲۵</span>
                        <span class="label">روز</span>
                    </div>
                    <div class="age-detail">
                        <span class="number" id="totalMonths">۳۰۶</span>
                        <span class="label">ماه</span>
                    </div>
                    <div class="age-detail">
                        <span class="number" id="totalWeeks">۱,۳۰۳</span>
                        <span class="label">هفته</span>
                    </div>
                    <div class="age-detail">
                        <span class="number" id="totalHours">۲۱۹,۰۰۰</span>
                        <span class="label">ساعت</span>
                    </div>
                </div>
                <div class="zodiac" id="zodiac">♌ برج اسد</div>
                <div class="next-birthday" id="nextBirthday">🎂 تولد بعدی: ۱۴۰۴/۱۲/۱۵ (۴۵ روز دیگر)</div>
            </div>
        </div>
    </main>


    <script src="../auth/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/seo.js"></script>

    <script>
        (function() {
            const persianMonthDays = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];

            const zodiacSigns = [
                { name: '♈ برج حمل', start: [1, 21], end: [2, 19] },
                { name: '♉ برج ثور', start: [2, 20], end: [3, 20] },
                { name: '♊ برج جوزا', start: [3, 21], end: [4, 21] },
                { name: '♋ برج سرطان', start: [4, 22], end: [5, 22] },
                { name: '♌ برج اسد', start: [5, 23], end: [6, 22] },
                { name: '♍ برج سنبله', start: [6, 23], end: [7, 22] },
                { name: '♎ برج میزان', start: [7, 23], end: [8, 22] },
                { name: '♏ برج عقرب', start: [8, 23], end: [9, 22] },
                { name: '♐ برج قوس', start: [9, 23], end: [10, 21] },
                { name: '♑ برج جدی', start: [10, 22], end: [11, 21] },
                { name: '♒ برج دلو', start: [11, 22], end: [12, 20] },
                { name: '♓ برج حوت', start: [12, 21], end: [1, 19] }
            ];

            function isLeapYear(year) {
                if (year > 0) {
                    const ay = (year + 38) % 2820;
                    return ((ay * 682) & 2047) > 1023;
                }
                return false;
            }

            function persianToGregorian(py, pm, pd) {
                if (py < 0 || pm < 1 || pm > 12 || pd < 1) return null;
                let pDays = 0;
                for (let i = 0; i < pm - 1; i++) pDays += persianMonthDays[i];
                pDays += pd - 1;
                let gy = py + 621;
                let gm = 3;
                let gd = 21;
                let days = pDays + 79;
                while (days >= 365) {
                    let leap = isLeapYear(gy);
                    let yearDays = leap ? 366 : 365;
                    if (days >= yearDays) { days -= yearDays;
                        gy++; } else break;
                }
                const monthDays = [31, 28 + (isLeapYear(gy) ? 1 : 0), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                gm = 0;
                while (days >= monthDays[gm]) { days -= monthDays[gm];
                    gm++; }
                gd = days + 1;
                return { year: gy, month: gm + 1, day: gd };
            }

            function gregorianToPersian(gy, gm, gd) {
                if (gy < 0 || gm < 1 || gm > 12 || gd < 1) return null;
                const gMonthDays = [31, 28 + (isLeapYear(gy) ? 1 : 0), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                let gDays = 0;
                for (let i = 0; i < gm - 1; i++) gDays += gMonthDays[i];
                gDays += gd - 1;
                let py = gy - 621;
                let pm = 0,
                    pd = 0;
                let days = gDays - 79;
                if (days >= 0) {
                    while (days >= 366) {
                        let leap = isLeapYear(py);
                        let yearDays = leap ? 366 : 365;
                        if (days >= yearDays) { days -= yearDays;
                            py++; } else break;
                    }
                    pm = 0;
                    while (days >= persianMonthDays[pm]) { days -= persianMonthDays[pm];
                        pm++; }
                    pd = days + 1;
                } else {
                    py--;
                    days += 365 + (isLeapYear(py) ? 1 : 0);
                    pm = 0;
                    while (days >= persianMonthDays[pm]) { days -= persianMonthDays[pm];
                        pm++; }
                    pd = days + 1;
                }
                return { year: py, month: pm + 1, day: pd };
            }

            function isPersianLeapYear(year) {
                if (year > 0) {
                    const ay = (year + 38) % 2820;
                    return ((ay * 682) & 2047) > 1023;
                }
                return false;
            }

            function persianMonthDaysCount(year, month) {
                if (month <= 6) return 31;
                if (month <= 11) return 30;
                return isPersianLeapYear(year) ? 30 : 29;
            }

            function isValidPersianDate(year, month, day) {
                if (year < 1 || month < 1 || month > 12 || day < 1) return false;
                const maxDay = persianMonthDaysCount(year, month);
                return day <= maxDay;
            }

            function getZodiac(month, day) {
                for (const sign of zodiacSigns) {
                    const [sm, sd] = sign.start;
                    const [em, ed] = sign.end;
                    if ((month === sm && day >= sd) || (month === em && day <= ed) ||
                        (month > sm && month < em) ||
                        (month === 12 && day >= 22 && sign.name.includes('حوت')) ||
                        (month === 1 && day <= 19 && sign.name.includes('حوت'))) {
                        return sign.name;
                    }
                }
                return '♈ برج حمل';
            }

            function getNextBirthday(year, month, day) {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                let next = new Date(today.getFullYear(), month - 1, day);
                if (next < today) {
                    next = new Date(today.getFullYear() + 1, month - 1, day);
                }
                const diff = Math.ceil((next - today) / (1000 * 60 * 60 * 24));
                const pDate = gregorianToPersian(next.getFullYear(), next.getMonth() + 1, next.getDate());
                return {
                    days: diff,
                    persianDate: pDate ? `${pDate.year}/${pDate.month}/${pDate.day}` : 'نامشخص'
                };
            }

            let currentCalendar = 'shamsi';

            document.querySelectorAll('#calendarToggle button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#calendarToggle button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentCalendar = this.dataset.calendar;

                    const yearInput = document.getElementById('year');
                    const monthSelect = document.getElementById('month');
                    const dayInput = document.getElementById('day');

                    if (currentCalendar === 'shamsi') {
                        yearInput.placeholder = '۱۴۰۴';
                        yearInput.min = 1300;
                        yearInput.max = 1405;
                        monthSelect.innerHTML = `
                            <option value="1">فروردین</option>
                            <option value="2">اردیبهشت</option>
                            <option value="3">خرداد</option>
                            <option value="4">تیر</option>
                            <option value="5">مرداد</option>
                            <option value="6">شهریور</option>
                            <option value="7">مهر</option>
                            <option value="8">آبان</option>
                            <option value="9">آذر</option>
                            <option value="10">دی</option>
                            <option value="11">بهمن</option>
                            <option value="12">اسفند</option>
                        `;
                    } else {
                        yearInput.placeholder = '۲۰۲۵';
                        yearInput.min = 1900;
                        yearInput.max = 2025;
                        monthSelect.innerHTML = `
                            <option value="1">ژانویه</option>
                            <option value="2">فوریه</option>
                            <option value="3">مارس</option>
                            <option value="4">آوریل</option>
                            <option value="5">مه</option>
                            <option value="6">ژوئن</option>
                            <option value="7">ژوئیه</option>
                            <option value="8">اوت</option>
                            <option value="9">سپتامبر</option>
                            <option value="10">اکتبر</option>
                            <option value="11">نوامبر</option>
                            <option value="12">دسامبر</option>
                        `;
                    }
                });
            });

            document.getElementById('ageForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const year = parseInt(document.getElementById('year').value);
                const month = parseInt(document.getElementById('month').value);
                const day = parseInt(document.getElementById('day').value);
                const resultBox = document.getElementById('resultBox');

                if (!year || !month || !day) {
                    alert('لطفاً تاریخ تولد خود را کامل وارد کنید.');
                    return;
                }

                let birthDate;

                if (currentCalendar === 'shamsi') {
                    if (!isValidPersianDate(year, month, day)) {
                        alert('تاریخ وارد شده نامعتبر است.');
                        return;
                    }
                    birthDate = persianToGregorian(year, month, day);
                    if (!birthDate) {
                        alert('خطا در تبدیل تاریخ.');
                        return;
                    }
                } else {
                    const now = new Date();
                    if (year < 1900 || year > now.getFullYear() + 1 || month < 1 || month > 12 || day < 1 || day > 31) {
                        alert('تاریخ وارد شده نامعتبر است.');
                        return;
                    }
                    const monthDays = [31, 28 + (isLeapYear(year) ? 1 : 0), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                    if (day > monthDays[month - 1]) {
                        alert('روز وارد شده برای این ماه نامعتبر است.');
                        return;
                    }
                    birthDate = { year, month, day };
                }

                const now = new Date();
                const nowPersian = gregorianToPersian(now.getFullYear(), now.getMonth() + 1, now.getDate());

                let ageYears = nowPersian.year - year;
                let ageMonths = nowPersian.month - month;
                let ageDays = nowPersian.day - day;

                if (currentCalendar === 'miladi') {
                    const birth = new Date(birthDate.year, birthDate.month - 1, birthDate.day);
                    let diff = now - birth;
                    if (diff < 0) {
                        alert('تاریخ تولد نمی‌تواند در آینده باشد.');
                        return;
                    }
                    const age = new Date(diff);
                    ageYears = age.getFullYear() - 1970;
                    ageMonths = age.getMonth();
                    ageDays = age.getDate() - 1;
                }

                if (ageDays < 0) {
                    const prevMonth = nowPersian.month - 1;
                    const prevMonthYear = nowPersian.year;
                    const daysInPrevMonth = persianMonthDaysCount(prevMonthYear, prevMonth > 0 ? prevMonth : 12);
                    ageDays += daysInPrevMonth;
                    ageMonths--;
                }

                if (ageMonths < 0) {
                    ageMonths += 12;
                    ageYears--;
                }

                if (ageYears < 0) {
                    alert('تاریخ تولد نمی‌تواند در آینده باشد.');
                    return;
                }

                const totalDays = Math.floor((now - new Date(birthDate.year, birthDate.month - 1, birthDate.day)) / (
                    1000 * 60 * 60 * 24));

                document.getElementById('ageNumber').textContent = ageYears;
                document.getElementById('ageLabel').textContent =
                    `${ageYears} سال و ${ageMonths} ماه و ${ageDays} روز`;

                document.getElementById('totalDays').textContent = totalDays.toLocaleString('fa-IR');
                document.getElementById('totalMonths').textContent = (ageYears * 12 + ageMonths).toLocaleString('fa-IR');
                document.getElementById('totalWeeks').textContent = Math.floor(totalDays / 7).toLocaleString('fa-IR');
                document.getElementById('totalHours').textContent = (totalDays * 24).toLocaleString('fa-IR');

                const birthMonth = currentCalendar === 'shamsi' ? month : birthDate.month;
                const birthDay = currentCalendar === 'shamsi' ? day : birthDate.day;
                document.getElementById('zodiac').textContent = getZodiac(birthMonth, birthDay);

                const nextBirthday = getNextBirthday(birthDate.year, birthDate.month, birthDate.day);
                document.getElementById('nextBirthday').textContent =
                    `🎂 تولد بعدی: ${nextBirthday.persianDate} (${nextBirthday.days} روز دیگر)`;

                resultBox.classList.add('visible');
            });
        })();
    </script>
</body>
</html>
