<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تبدیل ارز | نوینیکس</title>
    <meta name="description" content="تبدیل ارز آنلاین با نرخ لحظه‌ای. پشتیبانی از ۱۱ ارز اصلی جهان." />
    <link rel="canonical" href="https://novinix.ir/online-tools_page/currency-converter" />
    <link rel="icon" href="../assets/images/logo.ico" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/online-tools.css" />
    <style>
        .calc-wrapper h2 {
            color: #00ffcc;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 6px;
        }
        .calc-wrapper .subtitle {
            text-align: center;
            color: #a0b4c8;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #a0b4c8;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #e8f5f0;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.08);
        }
        .form-group select option {
            background: #0f0c29;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-calc {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            color: #0f0c29;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 5px;
        }
        .btn-calc:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 255, 204, 0.25);
        }

        .swap-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #a0b4c8;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 10px 0;
        }
        .swap-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #00ffcc;
        }

        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
        }
        .results.visible {
            display: block;
        }

        .result-box {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }
        .result-box .amount {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00ffcc;
        }
        .result-box .label {
            color: #a0b4c8;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .result-box .rate-info {
            color: rgba(160, 180, 200, 0.4);
            font-size: 0.75rem;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .result-box .amount {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    

    <main>
        <div class="tool-wrapper calc-wrapper">
            <h2>💱 تبدیل ارز</h2>
            <p class="subtitle">تبدیل ارز با نرخ لحظه‌ای (آپدیت روزانه)</p>

            <form id="currencyForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>💰 مبلغ</label>
                        <input type="number" id="currencyAmount" placeholder="مثلاً ۱۰۰" required min="0.01" step="0.01" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>🔄 از</label>
                        <select id="fromCurrency">
                            <option value="USD">🇺🇸 دلار آمریکا (USD)</option>
                            <option value="EUR">🇪🇺 یورو (EUR)</option>
                            <option value="GBP">🇬🇧 پوند (GBP)</option>
                            <option value="TRY">🇹🇷 لیر ترکیه (TRY)</option>
                            <option value="AED">🇦🇪 درهم امارات (AED)</option>
                            <option value="CAD">🇨🇦 دلار کانادا (CAD)</option>
                            <option value="AUD">🇦🇺 دلار استرالیا (AUD)</option>
                            <option value="JPY">🇯🇵 ین ژاپن (JPY)</option>
                            <option value="CNY">🇨🇳 یوان چین (CNY)</option>
                            <option value="RUB">🇷🇺 روبل روسیه (RUB)</option>
                            <option value="IRR" selected>🇮🇷 ریال ایران (IRR)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🔄 به</label>
                        <select id="toCurrency">
                            <option value="USD" selected>🇺🇸 دلار آمریکا (USD)</option>
                            <option value="EUR">🇪🇺 یورو (EUR)</option>
                            <option value="GBP">🇬🇧 پوند (GBP)</option>
                            <option value="TRY">🇹🇷 لیر ترکیه (TRY)</option>
                            <option value="AED">🇦🇪 درهم امارات (AED)</option>
                            <option value="CAD">🇨🇦 دلار کانادا (CAD)</option>
                            <option value="AUD">🇦🇺 دلار استرالیا (AUD)</option>
                            <option value="JPY">🇯🇵 ین ژاپن (JPY)</option>
                            <option value="CNY">🇨🇳 یوان چین (CNY)</option>
                            <option value="RUB">🇷🇺 روبل روسیه (RUB)</option>
                            <option value="IRR">🇮🇷 ریال ایران (IRR)</option>
                        </select>
                    </div>
                </div>

                <div style="text-align:center;">
                    <button type="button" class="swap-btn" id="swapBtn">🔄 تعویض</button>
                </div>

                <button type="submit" class="btn-calc">💱 تبدیل</button>
            </form>

            <div class="results" id="results">
                <div class="result-box">
                    <div class="amount" id="convertedAmount">۰</div>
                    <div class="label" id="convertedLabel">نتیجه تبدیل</div>
                    <div class="rate-info" id="rateInfo">نرخ: ۱ = ۱</div>
                </div>
            </div>
        </div>
    </main>


    <script src="../auth/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/seo.js"></script>
    <script src="../assets/js/user-panel.js"></script>

    <script>
        (function() {
            const exchangeRates = {
                'USD': 1,
                'EUR': 0.92,
                'GBP': 0.79,
                'TRY': 34.2,
                'AED': 3.67,
                'CAD': 1.38,
                'AUD': 1.52,
                'JPY': 149.8,
                'CNY': 7.24,
                'RUB': 92.5,
                'IRR': 180000
            };

            function getExchangeRate(from, to) {
                const rates = JSON.parse(localStorage.getItem('novinix_currency_rates') || JSON.stringify(exchangeRates));
                if (!rates[from] || !rates[to]) return null;
                return rates[to] / rates[from];
            }

            async function fetchLiveRates() {
                try {
                    const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                    if (response.ok) {
                        const data = await response.json();
                        const rates = data.rates;
                        const newRates = {};
                        for (const [key, value] of Object.entries(rates)) {
                            if (exchangeRates[key]) {
                                newRates[key] = value;
                            }
                        }
                        if (!newRates['IRR']) {
                            newRates['IRR'] = 42000;
                        }
                        localStorage.setItem('novinix_currency_rates', JSON.stringify(newRates));
                        return newRates;
                    }
                } catch (e) {
                    console.log('Using cached rates');
                }
                return null;
            }

            function convertCurrency(e) {
                e.preventDefault();

                const amount = parseFloat(document.getElementById('currencyAmount').value);
                const from = document.getElementById('fromCurrency').value;
                const to = document.getElementById('toCurrency').value;

                if (!amount || amount <= 0) {
                    alert('لطفاً مبلغ معتبر وارد کنید.');
                    return;
                }

                const rate = getExchangeRate(from, to);
                if (!rate) {
                    alert('نرخ تبدیل برای این ارزها موجود نیست.');
                    return;
                }

                const result = amount * rate;

                const fromLabel = document.getElementById('fromCurrency').selectedOptions[0].text;
                const toLabel = document.getElementById('toCurrency').selectedOptions[0].text;

                document.getElementById('convertedAmount').textContent = result.toLocaleString('fa-IR') + ' ' + to;
                document.getElementById('convertedLabel').textContent =
                    `${amount.toLocaleString('fa-IR')} ${from} = ${result.toLocaleString('fa-IR')} ${to}`;
                document.getElementById('rateInfo').textContent = `نرخ: ۱ ${from} = ${rate.toFixed(4)} ${to}`;

                document.getElementById('results').classList.add('visible');

                if (typeof UserPanel !== 'undefined') {
                    UserPanel.addHistory({
                        icon: '💱',
                        title: `${amount} ${from} → ${result.toFixed(2)} ${to}`,
                        link: '/online-tools_page/currency-converter.html'
                    });
                }
            }

            function swapCurrencies() {
                const from = document.getElementById('fromCurrency');
                const to = document.getElementById('toCurrency');
                const temp = from.value;
                from.value = to.value;
                to.value = temp;
                if (document.getElementById('currencyAmount').value) {
                    convertCurrency(new Event('submit'));
                }
            }

            document.getElementById('currencyForm').addEventListener('submit', convertCurrency);
            document.getElementById('swapBtn').addEventListener('click', swapCurrencies);

            document.addEventListener('DOMContentLoaded', function() {
                fetchLiveRates();
            });

            console.log('💱 Currency Converter loaded!');
        })();
    </script>
</body>
</html>
