<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ماشین‌حساب ماتریس آنلاین | ابزار محاسبه ماتریس Novinix</title>
    <meta name="description" content="ابزار حرفه‌ای محاسبه ماتریس شامل جمع، تفریق، ضرب، دترمینان و معکوس ماتریس." />
    <link rel="canonical" href="https://novinix.ir/online-tools_page/matrix-calculator" />
    <link rel="icon" href="../assets/images/logo.ico" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/online-tools.css" />
    <style>
        .matrix-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
            align-items: center;
        }
        .matrix-controls label {
            font-size: 0.82rem;
            color: #a0b4c8;
            font-weight: 500;
        }
        .matrix-controls select,
        .matrix-controls input[type="number"] {
            padding: 6px 12px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.04);
            color: #e8f5f0;
            width: 80px;
        }
        .matrix-controls select:focus,
        .matrix-controls input[type="number"]:focus {
            border-color: #00ffcc;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.1);
        }
        .matrix-controls select option {
            background: #0f0c29;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: start;
        }
        .matrix-grid .matrix-operator {
            font-size: 2rem;
            font-weight: 700;
            color: #00ffcc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
        }
        .matrix-table td {
            padding: 4px;
        }
        .matrix-table input[type="text"] {
            width: 60px;
            padding: 6px 4px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            text-align: center;
            transition: all 0.25s ease;
            direction: ltr;
            background: rgba(255, 255, 255, 0.04);
            color: #e8f5f0;
        }
        .matrix-table input[type="text"]:focus {
            border-color: #00ffcc;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.1);
            background: rgba(255, 255, 255, 0.06);
        }
        .matrix-table .matrix-label {
            font-size: 0.75rem;
            color: rgba(160, 180, 200, 0.4);
            text-align: center;
            display: block;
            margin-bottom: 4px;
        }

        .matrix-result {
            margin-top: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }
        .matrix-result .result-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
        }
        .matrix-result .result-label {
            font-size: 0.9rem;
            color: #a0b4c8;
        }

        .act-btn-sample {
            background: rgba(52, 152, 219, 0.12);
            color: #5fcde6;
            border: 1px solid rgba(52, 152, 219, 0.15);
        }
        .act-btn-sample:hover {
            background: rgba(52, 152, 219, 0.2);
        }

        @media (max-width: 640px) {
            .matrix-grid {
                grid-template-columns: 1fr;
            }
            .matrix-grid .matrix-operator {
                padding: 4px 0;
            }
            .matrix-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .matrix-table input[type="text"] {
                width: 45px;
                font-size: 0.8rem;
                padding: 4px;
            }
        }
    </style>
</head>
<body>

    

    <main>
        <div class="tool-wrapper">
            <div class="tool-header">
                <span class="icon">🧮</span>
                <h2>ماشین‌حساب ماتریس</h2>
                <span class="badge">جمع &bull; تفریق &bull; ضرب &bull; دترمینان</span>
            </div>

            <div class="matrix-controls">
                <label>عملیات:</label>
                <select id="matrixOperation">
                    <option value="add">جمع (+)</option>
                    <option value="subtract">تفریق (−)</option>
                    <option value="multiply">ضرب (×)</option>
                    <option value="determinant">دترمینان</option>
                    <option value="inverse">معکوس</option>
                </select>
                <label>سطرها:</label>
                <input type="number" id="matrixRows" value="2" min="1" max="5" />
                <label>ستون‌ها:</label>
                <input type="number" id="matrixCols" value="2" min="1" max="5" />
            </div>

            <div class="matrix-grid" id="matrixGrid">
                <div>
                    <span class="matrix-label">ماتریس A</span>
                    <table class="matrix-table" id="matrixA"></table>
                </div>
                <div class="matrix-operator" id="matrixOperator">+</div>
                <div>
                    <span class="matrix-label">ماتریس B</span>
                    <table class="matrix-table" id="matrixB"></table>
                </div>
            </div>

            <div class="matrix-result">
                <div class="result-label">نتیجه</div>
                <div class="result-value" id="matrixResultValue">—</div>
            </div>

            <div class="tool-actions">
                <button class="act-btn act-btn-copy" id="calcMatrixBtn" style="background:linear-gradient(135deg, #00ffcc, #00b4db);color:#0f0c29;">🧮 محاسبه</button>
                <button class="act-btn act-btn-sample" id="sampleMatrixBtn">📄 نمونه</button>
                <button class="act-btn act-btn-copy" id="copyMatrixBtn">📋 کپی</button>
                <button class="act-btn act-btn-clear" id="clearMatrixBtn">🗑️ پاک کردن</button>
            </div>
        </div>
    </main>

    

    <script src="../auth/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/seo.js"></script>

    <script>
        (function() {
            function buildMatrix(tableId, rows, cols, values) {
                const table = document.getElementById(tableId);
                table.innerHTML = '';
                for (let r = 0; r < rows; r++) {
                    const tr = document.createElement('tr');
                    for (let c = 0; c < cols; c++) {
                        const td = document.createElement('td');
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = values && values[r] && values[r][c] !== undefined ? values[r][c] : '0';
                        td.appendChild(input);
                        tr.appendChild(td);
                    }
                    table.appendChild(tr);
                }
            }

            function getMatrix(tableId) {
                const table = document.getElementById(tableId);
                const rows = table.querySelectorAll('tr');
                const result = [];
                rows.forEach(tr => {
                    const row = [];
                    tr.querySelectorAll('input').forEach(inp => row.push(parseFloat(inp.value) || 0));
                    result.push(row);
                });
                return result;
            }

            function matrixToString(m) {
                return m.map(row => row.join('\t')).join('\n');
            }

            function determinant(m) {
                if (m.length === 1) return m[0][0];
                if (m.length === 2) return m[0][0] * m[1][1] - m[0][1] * m[1][0];
                let det = 0;
                for (let c = 0; c < m.length; c++) {
                    const sub = m.slice(1).map(row => row.filter((_, i) => i !== c));
                    det += (c % 2 === 0 ? 1 : -1) * m[0][c] * determinant(sub);
                }
                return det;
            }

            function inverse(m) {
                const det = determinant(m);
                if (Math.abs(det) < 1e-10) return null;
                const n = m.length;
                const aug = m.map((row, i) => [...row, ...Array(n).fill(0).map((_, j) => i === j ? 1 : 0)]);
                for (let i = 0; i < n; i++) {
                    let maxRow = i;
                    for (let j = i + 1; j < n; j++) {
                        if (Math.abs(aug[j][i]) > Math.abs(aug[maxRow][i])) maxRow = j;
                    }
                    [aug[i], aug[maxRow]] = [aug[maxRow], aug[i]];
                    const pivot = aug[i][i];
                    if (Math.abs(pivot) < 1e-10) return null;
                    for (let j = 0; j < 2 * n; j++) aug[i][j] /= pivot;
                    for (let j = 0; j < n; j++) {
                        if (j === i) continue;
                        const factor = aug[j][i];
                        for (let k = 0; k < 2 * n; k++) aug[j][k] -= factor * aug[i][k];
                    }
                }
                return aug.map(row => row.slice(n));
            }

            function multiply(A, B) {
                const rows = A.length,
                    cols = B[0].length,
                    n = B.length;
                const result = Array.from({ length: rows }, () => Array(cols).fill(0));
                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        for (let k = 0; k < n; k++) result[i][j] += A[i][k] * B[k][j];
                    }
                }
                return result;
            }

            function calculate() {
                const op = document.getElementById('matrixOperation').value;
                const A = getMatrix('matrixA');
                const B = getMatrix('matrixB');
                let result;
                try {
                    switch (op) {
                        case 'add':
                            result = A.map((row, i) => row.map((v, j) => v + B[i][j]));
                            break;
                        case 'subtract':
                            result = A.map((row, i) => row.map((v, j) => v - B[i][j]));
                            break;
                        case 'multiply':
                            if (A[0].length !== B.length) {
                                document.getElementById('matrixResultValue').textContent = '❌ ابعاد نامتناسب';
                                return;
                            }
                            result = multiply(A, B);
                            break;
                        case 'determinant':
                            if (A.length !== A[0].length) {
                                document.getElementById('matrixResultValue').textContent = '❌ ماتریس مربعی نیست';
                                return;
                            }
                            document.getElementById('matrixResultValue').textContent = determinant(A);
                            return;
                        case 'inverse':
                            if (A.length !== A[0].length) {
                                document.getElementById('matrixResultValue').textContent = '❌ ماتریس مربعی نیست';
                                return;
                            }
                            const inv = inverse(A);
                            if (!inv) {
                                document.getElementById('matrixResultValue').textContent = '❌ ماتریس معکوس‌پذیر نیست';
                                return;
                            }
                            result = inv;
                            break;
                        default:
                            result = A;
                    }
                    document.getElementById('matrixResultValue').textContent = result.map(row => row.map(v => v.toFixed(4))
                        .join(' ')).join(' | ');
                } catch (e) {
                    document.getElementById('matrixResultValue').textContent = '❌ خطا در محاسبه';
                }
            }

            function rebuildMatrices() {
                const rows = parseInt(document.getElementById('matrixRows').value) || 2;
                const cols = parseInt(document.getElementById('matrixCols').value) || 2;
                buildMatrix('matrixA', rows, cols);
                buildMatrix('matrixB', rows, cols);
                document.getElementById('matrixOperator').textContent = document.getElementById('matrixOperation')
                    .selectedOptions[0].text;
                calculate();
            }

            document.getElementById('calcMatrixBtn').addEventListener('click', calculate);
            document.getElementById('matrixRows').addEventListener('change', rebuildMatrices);
            document.getElementById('matrixCols').addEventListener('change', rebuildMatrices);
            document.getElementById('matrixOperation').addEventListener('change', function() {
                document.getElementById('matrixOperator').textContent = this.selectedOptions[0].text;
                calculate();
            });

            document.getElementById('sampleMatrixBtn').addEventListener('click', function() {
                buildMatrix('matrixA', 2, 2, [
                    [1, 2],
                    [3, 4]
                ]);
                buildMatrix('matrixB', 2, 2, [
                    [5, 6],
                    [7, 8]
                ]);
                calculate();
            });

            document.getElementById('copyMatrixBtn').addEventListener('click', function() {
                const text = document.getElementById('matrixResultValue').textContent;
                if (text && text !== '—') {
                    navigator.clipboard.writeText(text).then(() => {
                        const orig = this.textContent;
                        this.textContent = '✅ کپی شد!';
                        this.classList.add('copied');
                        setTimeout(() => { this.textContent = orig;
                            this.classList.remove('copied'); }, 1500);
                    });
                }
            });

            document.getElementById('clearMatrixBtn').addEventListener('click', function() {
                const rows = parseInt(document.getElementById('matrixRows').value) || 2;
                const cols = parseInt(document.getElementById('matrixCols').value) || 2;
                buildMatrix('matrixA', rows, cols);
                buildMatrix('matrixB', rows, cols);
                document.getElementById('matrixResultValue').textContent = '—';
            });

            rebuildMatrices();
            console.log('🧮 Matrix Calculator loaded!');
        })();
    </script>
</body>
</html>
