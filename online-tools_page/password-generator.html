<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تولید رمز عبور قوی | ابزار امنیتی Novinix</title>
    <meta name="description" content="ابزار حرفه‌ای تولید رمز عبور قوی و امن. شامل اعداد، حروف بزرگ/کوچک، نمادها و تنظیمات پیشرفته." />
    <link rel="canonical" href="https://novinix.ir/online-tools_page/password-generator" />
    <link rel="icon" href="../assets/images/logo.ico" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/online-tools.css" />
    <style>
        .password-display {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 8px 8px 8px 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.2s ease;
            margin-bottom: 20px;
        }
        .password-display:focus-within {
            border-color: #00ffcc;
            box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.1);
        }
        .password-display input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 0;
            font-size: 1.3rem;
            font-family: 'Courier New', monospace;
            color: #e8f5f0;
            outline: none;
            direction: ltr;
            text-align: left;
            min-width: 0;
        }
        .password-display input::selection {
            background: #00ffcc;
            color: #0f0c29;
        }
        .password-display .copy-btn {
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            border: none;
            color: #0f0c29;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .password-display .copy-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.25);
        }
        .password-display .copy-btn:active {
            transform: scale(0.94);
        }
        .password-display .copy-btn.copied {
            background: #2ecc71;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 30px;
            margin: 20px 0 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00ffcc;
            cursor: pointer;
            flex-shrink: 0;
        }
        .option-item label {
            font-size: 0.95rem;
            color: #e8f5f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .option-item label .hint {
            font-size: 0.7rem;
            color: rgba(160, 180, 200, 0.4);
        }

        .length-control {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }
        .length-control label {
            font-weight: 500;
            color: #e8f5f0;
            font-size: 0.95rem;
        }
        .length-control .length-value {
            font-weight: 700;
            color: #00ffcc;
            font-size: 1.2rem;
            min-width: 40px;
            text-align: center;
        }
        .length-control input[type="range"] {
            flex: 1;
            min-width: 140px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
        }
        .length-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 255, 204, 0.3);
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            color: #0f0c29;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
            font-family: inherit;
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.25);
        }
        .generate-btn:active {
            transform: scale(0.97);
        }

        .strength-meter {
            margin-top: 20px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .strength-meter .label {
            font-size: 0.9rem;
            color: #a0b4c8;
            font-weight: 500;
        }
        .strength-meter .bar-wrapper {
            flex: 1;
            min-width: 120px;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
        }
        .strength-meter .bar-wrapper .bar-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.4s ease, background 0.4s ease;
        }
        .strength-meter .status-text {
            font-weight: 600;
            font-size: 0.9rem;
            min-width: 70px;
            text-align: left;
        }

        @media (max-width: 768px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .password-display {
                flex-wrap: wrap;
                padding: 8px;
            }
            .password-display input {
                font-size: 1rem;
                padding: 12px 10px;
                width: 100%;
                text-align: center;
            }
            .password-display .copy-btn {
                width: 100%;
                justify-content: center;
                padding: 12px;
            }
            .length-control {
                flex-wrap: wrap;
                justify-content: center;
            }
            .strength-meter {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .strength-meter .status-text {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    

    <main>
        <div class="tool-wrapper">
            <div class="tool-header">
                <span class="icon">🔑</span>
                <h2>تولید رمز عبور قوی</h2>
                <span class="badge">امن &bull; رایگان</span>
            </div>

            <div class="password-display">
                <input type="text" id="passwordOutput" readonly value="NvX9#kL2$mP7" />
                <button class="copy-btn" id="copyBtn">📋 کپی</button>
            </div>

            <div class="options-grid">
                <div class="option-item">
                    <input type="checkbox" id="includeUppercase" checked />
                    <label for="includeUppercase">حروف بزرگ <span class="hint">(A-Z)</span></label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="includeLowercase" checked />
                    <label for="includeLowercase">حروف کوچک <span class="hint">(a-z)</span></label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="includeNumbers" checked />
                    <label for="includeNumbers">اعداد <span class="hint">(0-9)</span></label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="includeSymbols" checked />
                    <label for="includeSymbols">نمادها <span class="hint">(!@#$%^&amp;*)</span></label>
                </div>
            </div>

            <div class="length-control">
                <label for="lengthSlider">طول رمز:</label>
                <input type="range" id="lengthSlider" min="6" max="50" value="14" />
                <span class="length-value" id="lengthDisplay">14</span>
            </div>

            <button class="generate-btn" id="generateBtn"><span>🔄</span> تولید رمز جدید</button>

            <div class="strength-meter">
                <span class="label">🔒 قدرت رمز:</span>
                <div class="bar-wrapper"><div class="bar-fill" id="strengthBar" style="width:100%; background:#00ffcc;"></div></div>
                <span class="status-text" id="strengthText">عالی</span>
            </div>
        </div>
    </main>

    

    <script src="../auth/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/seo.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const output = document.getElementById('passwordOutput');
            const copyBtn = document.getElementById('copyBtn');
            const generateBtn = document.getElementById('generateBtn');
            const lengthSlider = document.getElementById('lengthSlider');
            const lengthDisplay = document.getElementById('lengthDisplay');
            const includeUpper = document.getElementById('includeUppercase');
            const includeLower = document.getElementById('includeLowercase');
            const includeNumbers = document.getElementById('includeNumbers');
            const includeSymbols = document.getElementById('includeSymbols');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');

            const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const LOWER = 'abcdefghijklmnopqrstuvwxyz';
            const NUMBERS = '0123456789';
            const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';

            function generatePassword() {
                let chars = '';
                if (includeUpper.checked) chars += UPPER;
                if (includeLower.checked) chars += LOWER;
                if (includeNumbers.checked) chars += NUMBERS;
                if (includeSymbols.checked) chars += SYMBOLS;
                if (!chars) { chars = LOWER + NUMBERS; }
                const length = parseInt(lengthSlider.value);
                let password = '';
                for (let i = 0; i < length; i++) {
                    password += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return password;
            }

            function updateStrength(password) {
                let score = 0;
                if (password.length >= 8) score += 10;
                if (password.length >= 12) score += 10;
                if (password.length >= 16) score += 10;
                if (/[a-z]/.test(password)) score += 10;
                if (/[A-Z]/.test(password)) score += 10;
                if (/[0-9]/.test(password)) score += 10;
                if (/[^a-zA-Z0-9]/.test(password)) score += 15;
                if (new Set(password).size >= 6) score += 10;
                if (password.length >= 20) score += 15;

                let level, color, text;
                if (score >= 80) { level = 5;
                    color = '#00ffcc';
                    text = 'عالی'; } else if (score >= 65) { level = 4;
                    color = '#60e7a0';
                    text = 'خوب'; } else if (score >= 50) { level = 3;
                    color = '#fbbf24';
                    text = 'متوسط'; } else if (score >= 35) { level = 2;
                    color = '#f97316';
                    text = 'ضعیف'; } else { level = 1;
                    color = '#ef4444';
                    text = 'خیلی ضعیف'; }

                const pct = Math.min(100, score);
                strengthBar.style.width = pct + '%';
                strengthBar.style.background = color;
                strengthText.textContent = text;
                strengthText.style.color = color;
            }

            function updatePassword() {
                const pwd = generatePassword();
                output.value = pwd;
                updateStrength(pwd);
            }

            lengthSlider.addEventListener('input', function() {
                lengthDisplay.textContent = this.value;
                updatePassword();
            });

            [includeUpper, includeLower, includeNumbers, includeSymbols].forEach(el => {
                el.addEventListener('change', updatePassword);
            });

            generateBtn.addEventListener('click', updatePassword);

            copyBtn.addEventListener('click', function() {
                const pwd = output.value;
                if (!pwd) return;
                navigator.clipboard.writeText(pwd).then(() => {
                    const origText = this.innerHTML;
                    this.innerHTML = '✅ کپی شد!';
                    this.classList.add('copied');
                    setTimeout(() => {
                        this.innerHTML = origText;
                        this.classList.remove('copied');
                    }, 2000);
                });
            });

            updatePassword();
            console.log('🔑 Password Generator loaded!');
        });
    </script>
</body>
</html>
