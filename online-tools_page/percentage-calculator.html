<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ماشین‌حساب درصد آنلاین | ابزار محاسبه درصد Novinix</title>
    <meta name="description" content="ابزار حرفه‌ای محاسبه درصد، افزایش/کاهش درصد، تخفیف و نسبت‌ها." />
    <link rel="canonical" href="https://novinix.ir/online-tools_page/percentage-calculator" />
    <link rel="icon" href="../assets/images/logo.ico" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/online-tools.css" />
    <style>
        .pct-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }
        .pct-tabs .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 0.85rem;
            font-weight: 600;
            color: #a0b4c8;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .pct-tabs .tab-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #e8f5f0;
        }
        .pct-tabs .tab-btn.active {
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            color: #0f0c29;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
        }

        .pct-section {
            display: none;
            animation: fadeSlideIn 0.3s ease;
        }
        .pct-section.active {
            display: block;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pct-form .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px;
        }
        .pct-form .form-row label {
            font-size: 0.9rem;
            color: #a0b4c8;
            font-weight: 500;
            min-width: 80px;
        }
        .pct-form .form-row input {
            flex: 1;
            min-width: 100px;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.04);
            color: #e8f5f0;
            transition: all 0.25s ease;
            direction: ltr;
            text-align: right;
        }
        .pct-form .form-row input:focus {
            border-color: #00ffcc;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.1);
        }
        .pct-form .form-row input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }
        .pct-form .form-row .symbol {
            font-size: 1.2rem;
            color: #a0b4c8;
        }

        .pct-result {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            margin-top: 16px;
        }
        .pct-result .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00ffcc;
        }
        .pct-result .result-label {
            font-size: 0.9rem;
            color: #a0b4c8;
        }
        .pct-result .result-detail {
            font-size: 0.85rem;
            color: rgba(160, 180, 200, 0.4);
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .pct-tabs .tab-btn {
                font-size: 0.75rem;
                padding: 8px 14px;
            }
            .pct-form .form-row {
                flex-direction: column;
                align-items: stretch;
            }
            .pct-form .form-row label {
                min-width: auto;
            }
        }
    </style>
</head>
<body>

    

    <main>
        <div class="tool-wrapper">
            <div class="tool-header">
                <span class="icon">🧮</span>
                <h2>ماشین‌حساب درصد</h2>
                <span class="badge">تخفیف &bull; افزایش &bull; نسبت</span>
            </div>

            <div class="pct-tabs">
                <button class="tab-btn active" data-tab="percent-of">درصد از عدد</button>
                <button class="tab-btn" data-tab="what-percent">چند درصد</button>
                <button class="tab-btn" data-tab="change">افزایش/کاهش</button>
                <button class="tab-btn" data-tab="discount">تخفیف</button>
            </div>

            <!-- درصد از عدد -->
            <div class="pct-section active" id="percent-of">
                <div class="pct-form">
                    <div class="form-row"><label>درصد:</label><input type="number" id="pctOfPercent" value="20" step="any" /><span class="symbol">%</span></div>
                    <div class="form-row"><label>از عدد:</label><input type="number" id="pctOfNumber" value="200" step="any" /></div>
                </div>
                <div class="pct-result">
                    <div class="result-label">نتیجه</div>
                    <div class="result-value" id="pctOfResult">40</div>
                    <div class="result-detail" id="pctOfDetail">۲۰٪ از ۲۰۰ = ۴۰</div>
                </div>
                <div class="tool-actions">
                    <button class="act-btn act-btn-copy" id="calcPctOfBtn" style="background:linear-gradient(135deg, #00ffcc, #00b4db);color:#0f0c29;">🧮 محاسبه</button>
                    <button class="act-btn act-btn-copy" id="copyPctOfBtn">📋 کپی</button>
                    <button class="act-btn act-btn-clear" id="clearPctOfBtn">🗑️ پاک</button>
                </div>
            </div>

            <!-- چند درصد -->
            <div class="pct-section" id="what-percent">
                <div class="pct-form">
                    <div class="form-row"><label>عدد:</label><input type="number" id="wpNumber" value="40" step="any" /></div>
                    <div class="form-row"><label>از عدد:</label><input type="number" id="wpOfNumber" value="200" step="any" /></div>
                </div>
                <div class="pct-result">
                    <div class="result-label">نتیجه</div>
                    <div class="result-value" id="wpResult">20</div>
                    <div class="result-detail" id="wpDetail">۴۰ از ۲۰۰ = ۲۰٪</div>
                </div>
                <div class="tool-actions">
                    <button class="act-btn act-btn-copy" id="calcWpBtn" style="background:linear-gradient(135deg, #00ffcc, #00b4db);color:#0f0c29;">🧮 محاسبه</button>
                    <button class="act-btn act-btn-copy" id="copyWpBtn">📋 کپی</button>
                    <button class="act-btn act-btn-clear" id="clearWpBtn">🗑️ پاک</button>
                </div>
            </div>

            <!-- افزایش/کاهش -->
            <div class="pct-section" id="change">
                <div class="pct-form">
                    <div class="form-row"><label>مقدار اولیه:</label><input type="number" id="chStart" value="100" step="any" /></div>
                    <div class="form-row"><label>مقدار نهایی:</label><input type="number" id="chEnd" value="150" step="any" /></div>
                </div>
                <div class="pct-result">
                    <div class="result-label">تغییر</div>
                    <div class="result-value" id="chResult">+۵۰%</div>
                    <div class="result-detail" id="chDetail">افزایش ۵۰ واحد (۵۰%)</div>
                </div>
                <div class="tool-actions">
                    <button class="act-btn act-btn-copy" id="calcChBtn" style="background:linear-gradient(135deg, #00ffcc, #00b4db);color:#0f0c29;">🧮 محاسبه</button>
                    <button class="act-btn act-btn-copy" id="copyChBtn">📋 کپی</button>
                    <button class="act-btn act-btn-clear" id="clearChBtn">🗑️ پاک</button>
                </div>
            </div>

            <!-- تخفیف -->
            <div class="pct-section" id="discount">
                <div class="pct-form">
                    <div class="form-row"><label>قیمت اصلی:</label><input type="number" id="discPrice" value="1000000" step="any" /></div>
                    <div class="form-row"><label>درصد تخفیف:</label><input type="number" id="discPercent" value="20" step="any" /><span class="symbol">%</span></div>
                </div>
                <div class="pct-result">
                    <div class="result-label">قیمت پس از تخفیف</div>
                    <div class="result-value" id="discResult">۸۰۰,۰۰۰</div>
                    <div class="result-detail" id="discDetail">۲۰٪ تخفیف = ۲۰۰,۰۰۰ تومان</div>
                </div>
                <div class="tool-actions">
                    <button class="act-btn act-btn-copy" id="calcDiscBtn" style="background:linear-gradient(135deg, #00ffcc, #00b4db);color:#0f0c29;">🧮 محاسبه</button>
                    <button class="act-btn act-btn-copy" id="copyDiscBtn">📋 کپی</button>
                    <button class="act-btn act-btn-clear" id="clearDiscBtn">🗑️ پاک</button>
                </div>
            </div>
        </div>
    </main>

    

    <script src="../auth/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/seo.js"></script>

    <script>
        (function() {
            function formatNumber(n) {
                if (n === undefined || n === null || isNaN(n)) return '—';
                return n.toLocaleString('fa-IR');
            }

            // Tabs
            const tabBtns = document.querySelectorAll('.pct-tabs .tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.pct-section').forEach(s => s.classList.remove('active'));
                    document.getElementById(this.dataset.tab).classList.add('active');
                });
            });

            // درصد از عدد
            function calcPercentOf() {
                const p = parseFloat(document.getElementById('pctOfPercent').value) || 0;
                const n = parseFloat(document.getElementById('pctOfNumber').value) || 0;
                const result = (p / 100) * n;
                document.getElementById('pctOfResult').textContent = formatNumber(result);
                document.getElementById('pctOfDetail').textContent = `${p}٪ از ${formatNumber(n)} = ${formatNumber(result)}`;
            }
            document.getElementById('calcPctOfBtn').addEventListener('click', calcPercentOf);

            // چند درصد
            function calcWhatPercent() {
                const n = parseFloat(document.getElementById('wpNumber').value) || 0;
                const of = parseFloat(document.getElementById('wpOfNumber').value) || 0;
                if (of === 0) {
                    document.getElementById('wpResult').textContent = '—';
                    document.getElementById('wpDetail').textContent = 'عدد دوم نمی‌تواند صفر باشد';
                    return;
                }
                const result = (n / of) * 100;
                document.getElementById('wpResult').textContent = result.toFixed(2);
                document.getElementById('wpDetail').textContent = `${formatNumber(n)} از ${formatNumber(of)} = ${result.toFixed(2)}%`;
            }
            document.getElementById('calcWpBtn').addEventListener('click', calcWhatPercent);

            // افزایش/کاهش
            function calcChange() {
                const start = parseFloat(document.getElementById('chStart').value) || 0;
                const end = parseFloat(document.getElementById('chEnd').value) || 0;
                if (start === 0) {
                    document.getElementById('chResult').textContent = '—';
                    document.getElementById('chDetail').textContent = 'مقدار اولیه نمی‌تواند صفر باشد';
                    return;
                }
                const diff = end - start;
                const pct = (diff / start) * 100;
                const sign = diff >= 0 ? '+' : '';
                document.getElementById('chResult').textContent = `${sign}${pct.toFixed(2)}%`;
                document.getElementById('chDetail').textContent =
                    `${diff >= 0 ? 'افزایش' : 'کاهش'} ${formatNumber(Math.abs(diff))} واحد (${Math.abs(pct).toFixed(2)}%)`;
            }
            document.getElementById('calcChBtn').addEventListener('click', calcChange);

            // تخفیف
            function calcDiscount() {
                const price = parseFloat(document.getElementById('discPrice').value) || 0;
                const pct = parseFloat(document.getElementById('discPercent').value) || 0;
                const discount = (pct / 100) * price;
                const result = price - discount;
                document.getElementById('discResult').textContent = formatNumber(result);
                document.getElementById('discDetail').textContent = `${pct}% تخفیف = ${formatNumber(discount)} تومان`;
            }
            document.getElementById('calcDiscBtn').addEventListener('click', calcDiscount);

            // Copy buttons
            document.querySelectorAll('.act-btn-copy').forEach(btn => {
                btn.addEventListener('click', function() {
                    const section = this.closest('.pct-section');
                    const resultDiv = section.querySelector('.pct-result');
                    if (resultDiv) {
                        const text = resultDiv.textContent.trim();
                        navigator.clipboard.writeText(text).then(() => {
                            const orig = this.textContent;
                            this.textContent = '✅ کپی شد!';
                            setTimeout(() => this.textContent = orig, 1500);
                        });
                    }
                });
            });

            // Clear buttons
            document.querySelectorAll('.act-btn-clear').forEach(btn => {
                btn.addEventListener('click', function() {
                    const section = this.closest('.pct-section');
                    section.querySelectorAll('input[type="number"]').forEach(inp => inp.value = '');
                    section.querySelectorAll('.result-value').forEach(el => el.textContent = '—');
                    section.querySelectorAll('.result-detail').forEach(el => el.textContent = '—');
                });
            });

            // Initial calculations
            calcPercentOf();
            calcWhatPercent();
            calcChange();
            calcDiscount();

            console.log('🧮 Percentage Calculator loaded!');
        })();
    </script>
</body>
</html>
