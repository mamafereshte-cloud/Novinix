<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تست Regex آنلاین | ابزار آزمایش عبارت باقاعده Novinix</title>
    <meta name="description" content="ابزار حرفه‌ای تست و آزمایش عبارات باقاعده (Regex) بر روی متن." />
    <link rel="canonical" href="https://novinix.ir/online-tools_page/regex-tester" />
    <link rel="icon" href="../assets/images/logo.ico" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/online-tools.css" />
    <style>
        .regex-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
            align-items: center;
        }
        .regex-controls .regex-input {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .regex-controls .regex-input label {
            font-size: 0.85rem;
            color: #a0b4c8;
            font-weight: 500;
            white-space: nowrap;
        }
        .regex-controls .regex-input input[type="text"] {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            transition: all 0.25s ease;
            direction: ltr;
            background: rgba(255, 255, 255, 0.04);
            color: #e8f5f0;
        }
        .regex-controls .regex-input input[type="text"]:focus {
            border-color: #00ffcc;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.1);
        }
        .regex-controls .regex-flags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .regex-controls .regex-flags label {
            font-size: 0.78rem;
            color: #a0b4c8;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }
        .regex-controls .regex-flags input[type="checkbox"] {
            accent-color: #00ffcc;
            cursor: pointer;
        }

        .tool-textarea {
            min-height: 250px;
        }

        .regex-matches {
            margin-top: 16px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .regex-matches .match-title {
            font-size: 0.85rem;
            color: #a0b4c8;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .regex-matches .match-item {
            padding: 4px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            direction: ltr;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .regex-matches .match-item:last-child {
            border-bottom: none;
        }
        .regex-matches .match-item .match-text {
            color: #00ffcc;
            font-weight: 600;
        }
        .regex-matches .match-item .match-index {
            color: rgba(160, 180, 200, 0.3);
            font-size: 0.75rem;
            margin-left: 8px;
        }

        @media (max-width: 820px) {
            .regex-controls {
                grid-template-columns: 1fr;
            }
            .regex-controls .regex-input {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    

    <main>
        <div class="tool-wrapper">
            <div class="tool-header">
                <span class="icon">📋</span>
                <h2>تست Regex</h2>
                <span class="badge">عبارت باقاعده</span>
            </div>

            <div class="regex-controls">
                <div class="regex-input">
                    <label>🔍 Pattern:</label>
                    <input type="text" id="regexPattern" value="\b\w{5,}\b" placeholder="الگوی Regex..." />
                </div>
                <div class="regex-flags">
                    <label><input type="checkbox" id="flagGlobal" checked /> g</label>
                    <label><input type="checkbox" id="flagIgnoreCase" /> i</label>
                    <label><input type="checkbox" id="flagMultiline" /> m</label>
                </div>
            </div>

            <div class="two-col-layout">
                <div>
                    <div class="panel-header"><span>📥 متن تست</span></div>
                    <textarea class="tool-textarea" id="regexText" placeholder="متن تست را اینجا وارد کنید...">سلام! این یک متن نمونه برای تست Regex است.
کلمات با طول ۵ کاراکتر یا بیشتر: آموزش ها، جاوااسکریپت، نمونه، تست، ابزار، حرفه‌ای.
ایمیل‌ها: test@example.com, info@novinix.ir</textarea>
                </div>
                <div>
                    <div class="panel-header"><span>📤 نتیجه</span></div>
                    <textarea class="tool-textarea output" id="regexOutput" placeholder="نتیجه در اینجا نمایش داده می‌شود..." readonly></textarea>
                </div>
            </div>

            <div class="regex-matches">
                <div class="match-title">🎯 Match‌ها</div>
                <div id="matchList">—</div>
            </div>

            <div class="tool-stats">
                <span>📊 Match‌ها: <span class="stat-value" id="matchCount">۰</span></span>
                <span>⏱️ زمان: <span class="stat-value" id="execTime">۰ms</span></span>
            </div>

            <div class="tool-actions">
                <button class="act-btn act-btn-copy" id="testRegexBtn" style="background:linear-gradient(135deg, #00ffcc, #00b4db);color:#0f0c29;">🧪 تست</button>
                <button class="act-btn act-btn-copy" id="copyRegexBtn">📋 کپی</button>
                <button class="act-btn act-btn-clear" id="clearRegexBtn">🗑️ پاک کردن</button>
            </div>
        </div>
    </main>

    

    <script src="../auth/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/seo.js"></script>

    <script>
        (function() {
            const patternInput = document.getElementById('regexPattern');
            const textInput = document.getElementById('regexText');
            const output = document.getElementById('regexOutput');
            const matchList = document.getElementById('matchList');

            function testRegex() {
                const pattern = patternInput.value;
                const text = textInput.value;
                if (!pattern || !text) {
                    output.value = 'لطفاً الگو و متن را وارد کنید.';
                    matchList.innerHTML = '—';
                    return;
                }

                let flags = '';
                if (document.getElementById('flagGlobal').checked) flags += 'g';
                if (document.getElementById('flagIgnoreCase').checked) flags += 'i';
                if (document.getElementById('flagMultiline').checked) flags += 'm';

                const start = performance.now();
                try {
                    const regex = new RegExp(pattern, flags);
                    const matches = text.match(regex);
                    const end = performance.now();

                    document.getElementById('execTime').textContent = (end - start).toFixed(1) + 'ms';

                    if (matches) {
                        document.getElementById('matchCount').textContent = matches.length;
                        matchList.innerHTML = matches.map((m, i) =>
                            `<div class="match-item"><span class="match-index">#${i+1}</span><span class="match-text">${m}</span></div>`
                        ).join('');
                        output.value = `✅ ${matches.length} match پیدا شد:\n${matches.join('\n')}`;
                    } else {
                        document.getElementById('matchCount').textContent = '۰';
                        matchList.innerHTML = '❌ هیچ matchی پیدا نشد';
                        output.value = '❌ هیچ matchی پیدا نشد';
                    }
                } catch (e) {
                    output.value = '❌ خطا: ' + e.message;
                    matchList.innerHTML = '❌ ' + e.message;
                }
            }

            document.getElementById('testRegexBtn').addEventListener('click', testRegex);

            document.getElementById('copyRegexBtn').addEventListener('click', function() {
                const text = output.value;
                if (!text) return;
                navigator.clipboard.writeText(text).then(() => {
                    const orig = this.textContent;
                    this.textContent = '✅ کپی شد!';
                    this.classList.add('copied');
                    setTimeout(() => { this.textContent = orig;
                        this.classList.remove('copied'); }, 1500);
                });
            });

            document.getElementById('clearRegexBtn').addEventListener('click', function() {
                textInput.value = '';
                output.value = '';
                matchList.innerHTML = '—';
                document.getElementById('matchCount').textContent = '۰';
            });

            document.getElementById('flagGlobal').addEventListener('change', testRegex);
            document.getElementById('flagIgnoreCase').addEventListener('change', testRegex);
            document.getElementById('flagMultiline').addEventListener('change', testRegex);
            patternInput.addEventListener('input', testRegex);
            textInput.addEventListener('input', testRegex);

            testRegex();
            console.log('📋 Regex Tester loaded!');
        })();
    </script>
</body>
</html>
