    <script>
        (function() {
            moment.locale('fa');

            function parseDate(str, cal) {
                if (!str || str.trim() === '') return null;
                str = str.trim().replace(/[^\d\/\-]/g, '');
                if (cal === 'gregorian') {
                    const m = moment(str, ['YYYY/MM/DD', 'YYYY-M-D'], true);
                    return m.isValid() ? m.toDate() : null;
                } else if (cal === 'jalali') {
                    const m = moment(str, ['jYYYY/jMM/jDD', 'jYYYY-jM-jD'], true);
                    return m.isValid() ? m.toDate() : null;
                } else if (cal === 'islamic') {
                    const m = moment(str, ['iYYYY/iMM/iDD', 'iYYYY-iM-iD'], true);
                    return m.isValid() ? m.toDate() : null;
                }
                return null;
            }

            function formatJalali(date) {
                if (!date || isNaN(date.getTime())) return 'نامعتبر';
                const m = moment(date);
                const months = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
                return `${m.jDate()} ${months[m.jMonth()]} ${m.jYear()}`;
            }

            function formatIslamic(date) {
                if (!date || isNaN(date.getTime())) return 'نامعتبر';
                const m = moment(date);
                const months = ['محرم', 'صفر', 'ربیع‌الاول', 'ربیع‌الثانی', 'جمادی‌الاول', 'جمادی‌الثانی', 'رجب', 'شعبان', 'رمضان', 'شوال',
                    'ذی‌قعده', 'ذی‌الحجه'
                ];
                return `${m.iDate()} ${months[m.iMonth()]} ${m.iYear()}`;
            }

            function formatGregorian(date) {
                if (!date || isNaN(date.getTime())) return 'نامعتبر';
                const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',
                    'October', 'November', 'December'
                ];
                return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
            }

            function formatFullJalali(date) {
                if (!date || isNaN(date.getTime())) return 'نامعتبر';
                const weekdays = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];
                const m = moment(date);
                const months = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
                return `${weekdays[date.getDay()]} ${m.jDate()} ${months[m.jMonth()]} ${m.jYear()}`;
            }

            function getWeekday(date) {
                if (!date || isNaN(date.getTime())) return 'نامعتبر';
                const weekdays = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];
                return weekdays[date.getDay()];
            }

            function formatTime(date) {
                if (!date || isNaN(date.getTime())) return '--:--:--';
                const h = String(date.getHours()).padStart(2, '0');
                const m = String(date.getMinutes()).padStart(2, '0');
                const s = String(date.getSeconds()).padStart(2, '0');
                return `${h}:${m}:${s}`;
            }

            // DOM Refs
            const modeBtns = document.querySelectorAll('.mode-btn');
            const sectionToDate = document.getElementById('sectionToDate');
            const sectionToTimestamp = document.getElementById('sectionToTimestamp');
            const timestampInput = document.getElementById('timestampInput');
            const nowTimestampBtn = document.getElementById('nowTimestampBtn');
            const convertToDateBtn = document.getElementById('convertToDateBtn');
            const copyTimestampResult = document.getElementById('copyTimestampResult');
            const gregorianDate = document.getElementById('gregorianDate');
            const persianDate = document.getElementById('persianDate');
            const islamicDate = document.getElementById('islamicDate');
            const timeDisplay = document.getElementById('timeDisplay');
            const weekdayDisplay = document.getElementById('weekdayDisplay');
            const fullDateDisplay = document.getElementById('fullDateDisplay');
            const timezoneSelect = document.getElementById('timezoneSelect');
            const timezoneOffset = document.getElementById('timezoneOffset');
            const inputCalendar = document.getElementById('inputCalendar');
            const dateInput = document.getElementById('dateInput');
            const timeInput = document.getElementById('timeInput');
            const convertToTimestampBtn = document.getElementById('convertToTimestampBtn');
            const copyTimestampResult2 = document.getElementById('copyTimestampResult2');
            const timestampResult = document.getElementById('timestampResult');
            const gregorianDate2 = document.getElementById('gregorianDate2');
            const persianDate2 = document.getElementById('persianDate2');
            const islamicDate2 = document.getElementById('islamicDate2');

            function getTimezone() { return timezoneSelect.value; }

            function updateTimezoneOffset() {
                try {
                    const tz = getTimezone();
                    const now = new Date();
                    const local = new Date(now.toLocaleString('en-US', { timeZone: tz }));
                    const offsetMinutes = -(now.getTimezoneOffset() - local.getTimezoneOffset());
                    const hours = Math.floor(Math.abs(offsetMinutes) / 60);
                    const mins = Math.abs(offsetMinutes) % 60;
                    const sign = offsetMinutes >= 0 ? '+' : '-';
                    timezoneOffset.textContent = `UTC${sign}${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
                } catch (e) { timezoneOffset.textContent = 'UTC+00:00'; }
            }

            function timestampToDate(timestamp, tz) {
                try {
                    const date = new Date(timestamp * 1000);
                    const formatter = new Intl.DateTimeFormat('en-US', {
                        timeZone: tz,
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });
                    const parts = formatter.formatToParts(date);
                    let year = '',
                        month = '',
                        day = '',
                        hour = '',
                        minute = '',
                        second = '';
                    parts.forEach(p => {
                        if (p.type === 'year') year = p.value;
                        if (p.type === 'month') month = p.value;
                        if (p.type === 'day') day = p.value;
                        if (p.type === 'hour') hour = p.value;
                        if (p.type === 'minute') minute = p.value;
                        if (p.type === 'second') second = p.value;
                    });
                    const dateObj = new Date(Date.UTC(parseInt(year), parseInt(month) - 1, parseInt(day), parseInt(hour),
                        parseInt(minute), parseInt(second)));
                    return {
                        gregorian: formatGregorian(dateObj),
                        persian: formatJalali(dateObj),
                        islamic: formatIslamic(dateObj),
                        time: `${hour}:${minute}:${second}`,
                        weekday: getWeekday(dateObj),
                        full: formatFullJalali(dateObj),
                        dateObj: dateObj
                    };
                } catch (e) { return null; }
            }

            function updateToDate() {
                const val = timestampInput.value.trim();
                const timestamp = parseInt(val, 10);
                if (isNaN(timestamp) || timestamp < 0) {
                    gregorianDate.textContent = '❌ نامعتبر';
                    persianDate.textContent = '❌ نامعتبر';
                    islamicDate.textContent = '❌ نامعتبر';
                    timeDisplay.textContent = '❌';
                    weekdayDisplay.textContent = '❌';
                    fullDateDisplay.textContent = '❌';
                    return;
                }
                const result = timestampToDate(timestamp, getTimezone());
                if (!result) {
                    gregorianDate.textContent = '⚠️ خطا';
                    persianDate.textContent = '⚠️ خطا';
                    islamicDate.textContent = '⚠️ خطا';
                    timeDisplay.textContent = '⚠️';
                    weekdayDisplay.textContent = '⚠️';
                    fullDateDisplay.textContent = '⚠️';
                    return;
                }
                gregorianDate.textContent = result.gregorian;
                persianDate.textContent = result.persian;
                islamicDate.textContent = result.islamic;
                timeDisplay.textContent = result.time;
                weekdayDisplay.textContent = result.weekday;
                fullDateDisplay.textContent = result.full;
            }

            function dateToTimestamp(dateStr, timeStr, tz, cal) {
                try {
                    const date = parseDate(dateStr, cal);
                    if (!date) return null;
                    if (timeStr) {
                        const timeParts = timeStr.split(':');
                        if (timeParts.length >= 2) {
                            date.setHours(parseInt(timeParts[0]) || 0);
                            date.setMinutes(parseInt(timeParts[1]) || 0);
                            date.setSeconds(parseInt(timeParts[2]) || 0);
                        }
                    }
                    const localDate = new Date(date.toLocaleString('en-US', { timeZone: tz }));
                    const timestamp = Math.floor(localDate.getTime() / 1000);
                    return {
                        timestamp: timestamp,
                        gregorian: formatGregorian(localDate),
                        persian: formatJalali(localDate),
                        islamic: formatIslamic(localDate)
                    };
                } catch (e) { return null; }
            }

            function updateToTimestamp() {
                const dateVal = dateInput.value.trim();
                if (!dateVal) {
                    timestampResult.textContent = '⚠️ تاریخ را وارد کنید';
                    gregorianDate2.textContent = '—';
                    persianDate2.textContent = '—';
                    islamicDate2.textContent = '—';
                    return;
                }
                const result = dateToTimestamp(dateVal, timeInput.value || '00:00:00', getTimezone(), inputCalendar.value);
                if (!result) {
                    timestampResult.textContent = '❌ خطا در تبدیل';
                    gregorianDate2.textContent = '❌';
                    persianDate2.textContent = '❌';
                    islamicDate2.textContent = '❌';
                    return;
                }
                timestampResult.textContent = result.timestamp.toLocaleString('en-US');
                gregorianDate2.textContent = result.gregorian;
                persianDate2.textContent = result.persian;
                islamicDate2.textContent = result.islamic;
            }

            function setCurrentTimestamp() {
                const now = Math.floor(Date.now() / 1000);
                timestampInput.value = now;
                updateToDate();
            }

            function setTodayDate() {
                const cal = inputCalendar.value;
                const now = new Date();
                let dateStr = '';
                if (cal === 'gregorian') dateStr = moment(now).format('YYYY/MM/DD');
                else if (cal === 'jalali') dateStr = moment(now).format('jYYYY/jMM/jDD');
                else if (cal === 'islamic') dateStr = moment(now).format('iYYYY/iMM/iDD');
                dateInput.value = dateStr;
                updateToTimestamp();
            }

            function copyResults() {
                const text = `تایم‌استمپ: ${timestampInput.value}
تاریخ میلادی: ${gregorianDate.textContent}
تاریخ شمسی: ${persianDate.textContent}
تاریخ قمری: ${islamicDate.textContent}
ساعت: ${timeDisplay.textContent}
روز هفته: ${weekdayDisplay.textContent}
تاریخ کامل: ${fullDateDisplay.textContent}
منطقه زمانی: ${timezoneOffset.textContent}`;
                copyToClipboard(text, copyTimestampResult);
            }

            function copyTimestampResultOnly() {
                const text = timestampResult.textContent;
                if (text && !text.includes('⚠️') && !text.includes('❌')) {
                    copyToClipboard(text, copyTimestampResult2);
                } else { alert('لطفاً ابتدا تبدیل را انجام دهید.'); }
            }

            function copyToClipboard(text, btn) {
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text)
                        .then(() => { btn.textContent = '✅ کپی شد';
                            btn.classList.add('copied');
                            setTimeout(() => { btn.textContent = btn.dataset.original || '📋 کپی';
                                btn.classList.remove('copied'); }, 2000); })
                        .catch(() => fallbackCopy(text, btn));
                } else { fallbackCopy(text, btn); }
            }

            function fallbackCopy(text, btn) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try { document.execCommand('copy');
                    btn.textContent = '✅ کپی شد';
                    setTimeout(() => { btn.textContent = btn.dataset.original || '📋 کپی'; }, 2000); } catch (_) { alert(
                        'کپی نشد.'); }
                document.body.removeChild(textarea);
            }

            function switchMode(mode) {
                modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
                sectionToDate.classList.toggle('active', mode === 'toDate');
                sectionToTimestamp.classList.toggle('active', mode === 'toTimestamp');
                if (mode === 'toTimestamp' && !dateInput.value) setTodayDate();
                if (mode === 'toDate') updateToDate();
            }

            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() { switchMode(this.dataset.mode); });
            });

            convertToDateBtn.addEventListener('click', updateToDate);
            convertToTimestampBtn.addEventListener('click', updateToTimestamp);
            nowTimestampBtn.addEventListener('click', setCurrentTimestamp);
            copyTimestampResult.addEventListener('click', copyResults);
            copyTimestampResult2.addEventListener('click', copyTimestampResultOnly);

            timezoneSelect.addEventListener('change', function() {
                updateTimezoneOffset();
                if (sectionToDate.classList.contains('active')) updateToDate();
                else updateToTimestamp();
            });

            inputCalendar.addEventListener('change', setTodayDate);

            timestampInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault();
                    updateToDate(); } });
            dateInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault();
                    updateToTimestamp(); } });
            dateInput.addEventListener('change', updateToTimestamp);
            timeInput.addEventListener('change', updateToTimestamp);

            // Init
            const now = new Date();
            dateInput.value = moment(now).format('jYYYY/jMM/jDD');
            const timestamp = Math.floor(Date.now() / 1000);
            timestampInput.value = timestamp;
            updateTimezoneOffset();
            updateToDate();
            updateToTimestamp();

            console.log('⏳ Timestamp Converter loaded!');
        })();
    </script>
</body>
</html>
