<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تبدیل واحد آنلاین | ابزار تبدیل واحدها Novinix</title>
    <meta name="description" content="ابزار کامل تبدیل واحد آنلاین شامل طول، جرم، دما، مساحت، حجم، سرعت، زمان، حافظه، فشار، انرژی و زاویه." />
    <link rel="canonical" href="https://novinix.ir/online-tools_page/unit-converter" />
    <link rel="icon" href="../assets/images/logo.ico" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/online-tools.css" />
    <style>
        .category-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }
        .category-tabs .tab-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #a0b4c8;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            white-space: nowrap;
        }
        .category-tabs .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #e8f5f0;
        }
        .category-tabs .tab-btn.active {
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            color: #0f0c29;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
        }

        .converter-section {
            display: none;
            animation: fadeSlideIn 0.3s ease;
        }
        .converter-section.active {
            display: block;
        }

        .converter-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }
        .converter-row .swap-icon {
            font-size: 1.5rem;
            color: rgba(160, 180, 200, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
            padding: 8px;
            border-radius: 50%;
            user-select: none;
        }
        .converter-row .swap-icon:hover {
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.08);
            transform: rotate(180deg);
        }

        .converter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .converter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #a0b4c8;
        }
        .converter-group select,
        .converter-group input {
            padding: 12px 14px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.04);
            color: #e8f5f0;
            transition: all 0.25s ease;
            font-family: inherit;
            width: 100%;
        }
        .converter-group select:focus,
        .converter-group input:focus {
            border-color: #00ffcc;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.1);
        }
        .converter-group input {
            direction: ltr;
            text-align: right;
            font-size: 1.1rem;
        }
        .converter-group select option {
            background: #0f0c29;
            color: #e8f5f0;
        }

        .result-box {
            background: rgba(0, 255, 204, 0.04);
            border-radius: 16px;
            padding: 20px 24px;
            margin-top: 20px;
            border: 1px solid rgba(0, 255, 204, 0.1);
            text-align: center;
        }
        .result-box .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00ffcc;
            direction: ltr;
            font-family: 'Courier New', monospace;
        }
        .result-box .result-detail {
            font-size: 0.9rem;
            color: #a0b4c8;
            margin-top: 4px;
        }
        .result-box .result-detail span {
            font-weight: 600;
            color: #00ffcc;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
            justify-content: center;
        }
        .quick-actions .q-btn {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 0.8rem;
            color: #a0b4c8;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .quick-actions .q-btn:hover {
            border-color: #00ffcc;
            color: #00ffcc;
            transform: translateY(-1px);
        }

        .unit-reference {
            margin-top: 20px;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            font-size: 0.8rem;
            color: rgba(160, 180, 200, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .converter-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .converter-row .swap-icon {
                align-self: center;
                transform: rotate(90deg);
            }
            .converter-row .swap-icon:hover {
                transform: rotate(90deg) scale(1.1);
            }
            .category-tabs .tab-btn {
                font-size: 0.7rem;
                padding: 6px 10px;
            }
            .result-box .result-value {
                font-size: 1.5rem;
            }
        }
        @media (max-width: 400px) {
            .category-tabs .tab-btn {
                flex: 1;
                justify-content: center;
                font-size: 0.65rem;
                padding: 5px 6px;
            }
        }
    </style>
</head>
<body>

    

    <main>
        <div class="tool-wrapper">
            <div class="tool-header">
                <span class="icon">📏</span>
                <h2>تبدیل واحد</h2>
                <span class="badge">حرفه‌ای &bull; دقیق</span>
            </div>

            <div class="category-tabs" id="categoryTabs">
                <button class="tab-btn active" data-category="length">📐 طول</button>
                <button class="tab-btn" data-category="weight">⚖️ جرم</button>
                <button class="tab-btn" data-category="temperature">🌡️ دما</button>
                <button class="tab-btn" data-category="area">📐 مساحت</button>
                <button class="tab-btn" data-category="volume">🧪 حجم</button>
                <button class="tab-btn" data-category="speed">🏃 سرعت</button>
                <button class="tab-btn" data-category="time">⏱️ زمان</button>
                <button class="tab-btn" data-category="storage">💾 حافظه</button>
                <button class="tab-btn" data-category="pressure"> فشار</button>
                <button class="tab-btn" data-category="energy">⚡ انرژی</button>
                <button class="tab-btn" data-category="angle">📐 زاویه</button>
            </div>

            <div id="converterSections"></div>

            <div class="result-box">
                <div class="result-value" id="resultValue">۱</div>
                <div class="result-detail"><span id="fromUnitLabel">متر</span> = <span id="toUnitLabel">سانتی‌متر</span></div>
            </div>

            <div class="quick-actions" id="quickActions">
                <button class="q-btn" data-value="1">۱</button>
                <button class="q-btn" data-value="5">۵</button>
                <button class="q-btn" data-value="10">۱۰</button>
                <button class="q-btn" data-value="50">۵۰</button>
                <button class="q-btn" data-value="100">۱۰۰</button>
                <button class="q-btn" data-value="1000">۱۰۰۰</button>
            </div>

            <div class="unit-reference" id="unitReference"></div>
        </div>
    </main>

    

    <script src="../auth/auth.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/seo.js"></script>

    <script>
        (function() {
            const UNITS = {
                length: {
                    label: 'طول',
                    baseUnit: 'meter',
                    units: {
                        meter: { label: 'متر', factor: 1 },
                        kilometer: { label: 'کیلومتر', factor: 1000 },
                        centimeter: { label: 'سانتی‌متر', factor: 0.01 },
                        millimeter: { label: 'میلی‌متر', factor: 0.001 },
                        mile: { label: 'مایل', factor: 1609.344 },
                        yard: { label: 'یارد', factor: 0.9144 },
                        foot: { label: 'فوت', factor: 0.3048 },
                        inch: { label: 'اینچ', factor: 0.0254 },
                        nautical_mile: { label: 'مایل دریایی', factor: 1852 }
                    }
                },
                weight: {
                    label: 'جرم',
                    baseUnit: 'gram',
                    units: {
                        gram: { label: 'گرم', factor: 1 },
                        kilogram: { label: 'کیلوگرم', factor: 1000 },
                        milligram: { label: 'میلی‌گرم', factor: 0.001 },
                        ton: { label: 'تن', factor: 1000000 },
                        pound: { label: 'پوند', factor: 453.59237 },
                        ounce: { label: 'اونس', factor: 28.3495 }
                    }
                },
                temperature: {
                    label: 'دما',
                    baseUnit: 'celsius',
                    units: { celsius: { label: 'سلسیوس', factor: 1 }, fahrenheit: { label: 'فارنهایت', factor: 1 },
                        kelvin: { label: 'کلوین', factor: 1 } },
                    customConvert: true
                },
                area: {
                    label: 'مساحت',
                    baseUnit: 'square_meter',
                    units: {
                        square_meter: { label: 'متر مربع', factor: 1 },
                        square_kilometer: { label: 'کیلومتر مربع', factor: 1000000 },
                        square_centimeter: { label: 'سانتی‌متر مربع', factor: 0.0001 },
                        hectare: { label: 'هکتار', factor: 10000 },
                        acre: { label: 'ایکر', factor: 4046.85642 },
                        square_mile: { label: 'مایل مربع', factor: 2589988.11 },
                        square_yard: { label: 'یارد مربع', factor: 0.836127 },
                        square_foot: { label: 'فوت مربع', factor: 0.092903 }
                    }
                },
                volume: {
                    label: 'حجم',
                    baseUnit: 'liter',
                    units: {
                        liter: { label: 'لیتر', factor: 1 },
                        milliliter: { label: 'میلی‌لیتر', factor: 0.001 },
                        cubic_meter: { label: 'متر مکعب', factor: 1000 },
                        gallon_us: { label: 'گالن (آمریکا)', factor: 3.78541 },
                        gallon_uk: { label: 'گالن (بریتانیا)', factor: 4.54609 },
                        cup: { label: 'فنجان', factor: 0.24 },
                        pint: { label: 'پینت', factor: 0.473176 },
                        quart: { label: 'کوارت', factor: 0.946353 }
                    }
                },
                speed: {
                    label: 'سرعت',
                    baseUnit: 'meter_per_second',
                    units: {
                        meter_per_second: { label: 'متر بر ثانیه', factor: 1 },
                        kilometer_per_hour: { label: 'کیلومتر بر ساعت', factor: 0.277778 },
                        mile_per_hour: { label: 'مایل بر ساعت', factor: 0.44704 },
                        knot: { label: 'گره', factor: 0.514444 }
                    }
                },
                time: {
                    label: 'زمان',
                    baseUnit: 'second',
                    units: {
                        second: { label: 'ثانیه', factor: 1 },
                        minute: { label: 'دقیقه', factor: 60 },
                        hour: { label: 'ساعت', factor: 3600 },
                        day: { label: 'روز', factor: 86400 },
                        week: { label: 'هفته', factor: 604800 },
                        month: { label: 'ماه (۳۰ روز)', factor: 2592000 },
                        year: { label: 'سال (۳۶۵ روز)', factor: 31536000 }
                    }
                },
                storage: {
                    label: 'حافظه',
                    baseUnit: 'byte',
                    units: {
                        byte: { label: 'بایت', factor: 1 },
                        kilobyte: { label: 'کیلوبایت', factor: 1024 },
                        megabyte: { label: 'مگابایت', factor: 1048576 },
                        gigabyte: { label: 'گیگابایت', factor: 1073741824 },
                        terabyte: { label: 'ترابایت', factor: 1099511627776 },
                        petabyte: { label: 'پتابایت', factor: 1125899906842624 }
                    }
                },
                pressure: {
                    label: 'فشار',
                    baseUnit: 'pascal',
                    units: {
                        pascal: { label: 'پاسکال (Pa)', factor: 1 },
                        kilopascal: { label: 'کیلوپاسکال (kPa)', factor: 1000 },
                        megapascal: { label: 'مگاپاسکال (MPa)', factor: 1000000 },
                        bar: { label: 'بار', factor: 100000 },
                        millibar: { label: 'میلی‌بار', factor: 100 },
                        atmosphere: { label: 'اتمسفر (atm)', factor: 101325 },
                        psi: { label: 'PSI', factor: 6894.76 },
                        torr: { label: 'تور (mmHg)', factor: 133.322 },
                        mmhg: { label: 'میلی‌متر جیوه', factor: 133.322 }
                    }
                },
                energy: {
                    label: 'انرژی',
                    baseUnit: 'joule',
                    units: {
                        joule: { label: 'ژول (J)', factor: 1 },
                        kilojoule: { label: 'کیلوژول (kJ)', factor: 1000 },
                        megajoule: { label: 'مگاژول (MJ)', factor: 1000000 },
                        calorie: { label: 'کالری (cal)', factor: 4.184 },
                        kilocalorie: { label: 'کیلوکالری (kcal)', factor: 4184 },
                        watt_hour: { label: 'وات‌ساعت (Wh)', factor: 3600 },
                        kilowatt_hour: { label: 'کیلووات‌ساعت (kWh)', factor: 3600000 },
                        electronvolt: { label: 'الکترون‌ولت (eV)', factor: 1.602176634e-19 },
                        btu: { label: 'BTU', factor: 1055.06 }
                    }
                },
                angle: {
                    label: 'زاویه',
                    baseUnit: 'degree',
                    units: {
                        degree: { label: 'درجه (°)', factor: 1 },
                        radian: { label: 'رادیان (rad)', factor: 180 / Math.PI },
                        gradian: { label: 'گراد (grad)', factor: 0.9 },
                        milliradian: { label: 'میلی‌رادیان (mrad)', factor: 180 / (1000 * Math.PI) },
                        arcminute: { label: 'دقیقه قوسی (′)', factor: 1 / 60 },
                        arcsecond: { label: 'ثانیه قوسی (″)', factor: 1 / 3600 }
                    }
                }
            };

            let state = { category: 'length', fromUnit: 'meter', toUnit: 'centimeter', inputValue: 1 };

            const sectionsContainer = document.getElementById('converterSections');
            const resultValue = document.getElementById('resultValue');
            const fromUnitLabel = document.getElementById('fromUnitLabel');
            const toUnitLabel = document.getElementById('toUnitLabel');
            const unitReference = document.getElementById('unitReference');

            function convertTemperature(value, from, to) {
                let celsius;
                switch (from) {
                    case 'celsius':
                        celsius = value;
                        break;
                    case 'fahrenheit':
                        celsius = (value - 32) * 5 / 9;
                        break;
                    case 'kelvin':
                        celsius = value - 273.15;
                        break;
                    default:
                        return value;
                }
                switch (to) {
                    case 'celsius':
                        return celsius;
                    case 'fahrenheit':
                        return celsius * 9 / 5 + 32;
                    case 'kelvin':
                        return celsius + 273.15;
                    default:
                        return celsius;
                }
            }

            function convertLinear(value, fromFactor, toFactor) { return (value * fromFactor) / toFactor; }

            function performConversion(value, category, fromUnit, toUnit) {
                const unitData = UNITS[category];
                if (!unitData) return 0;
                if (unitData.customConvert) return convertTemperature(value, fromUnit, toUnit);
                const fromFactor = unitData.units[fromUnit]?.factor || 1;
                const toFactor = unitData.units[toUnit]?.factor || 1;
                return convertLinear(value, fromFactor, toFactor);
            }

            function updateResult() {
                const val = parseFloat(state.inputValue) || 0;
                const result = performConversion(val, state.category, state.fromUnit, state.toUnit);
                let displayVal;
                if (Number.isInteger(result) && Math.abs(result) < 1e15) {
                    displayVal = result.toString();
                } else if (Math.abs(result) < 0.000001 || Math.abs(result) > 999999999) {
                    displayVal = result.toExponential(6);
                } else {
                    displayVal = parseFloat(result.toPrecision(10)).toString();
                }
                resultValue.textContent = displayVal;
                fromUnitLabel.textContent = UNITS[state.category].units[state.fromUnit]?.label || state.fromUnit;
                toUnitLabel.textContent = UNITS[state.category].units[state.toUnit]?.label || state.toUnit;
            }

            function buildSections() {
                sectionsContainer.innerHTML = '';
                const categories = Object.keys(UNITS);
                categories.forEach(cat => {
                    const unitData = UNITS[cat];
                    const unitKeys = Object.keys(unitData.units);
                    const isActive = cat === state.category;
                    const section = document.createElement('div');
                    section.className = `converter-section${isActive ? ' active' : ''}`;
                    section.dataset.category = cat;

                    // Row 1
                    const row1 = document.createElement('div');
                    row1.className = 'converter-row';
                    const fromGroup = document.createElement('div');
                    fromGroup.className = 'converter-group';
                    const fromLabel = document.createElement('label');
                    fromLabel.textContent = 'از:';
                    fromGroup.appendChild(fromLabel);
                    const fromSelect = document.createElement('select');
                    fromSelect.id = `${cat}_from_select`;
                    fromSelect.dataset.type = 'from';
                    fromSelect.dataset.category = cat;
                    unitKeys.forEach(key => {
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.textContent = unitData.units[key].label;
                        if (key === state.fromUnit && cat === state.category) opt.selected = true;
                        fromSelect.appendChild(opt);
                    });
                    fromGroup.appendChild(fromSelect);
                    row1.appendChild(fromGroup);

                    const swap = document.createElement('span');
                    swap.className = 'swap-icon';
                    swap.textContent = '⇄';
                    swap.dataset.category = cat;
                    swap.addEventListener('click', function() { swapUnits(cat); });
                    row1.appendChild(swap);

                    const inputGroup = document.createElement('div');
                    inputGroup.className = 'converter-group';
                    const inputLabel = document.createElement('label');
                    inputLabel.textContent = 'مقدار:';
                    inputGroup.appendChild(inputLabel);
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.id = `${cat}_input`;
                    input.value = cat === state.category ? state.inputValue : 1;
                    input.step = 'any';
                    input.placeholder = 'مقدار را وارد کنید...';
                    input.dataset.category = cat;
                    input.addEventListener('input', function() {
                        state.inputValue = parseFloat(this.value) || 0;
                        updateResult();
                    });
                    inputGroup.appendChild(input);
                    row1.appendChild(inputGroup);
                    section.appendChild(row1);

                    // Row 2
                    const row2 = document.createElement('div');
                    row2.className = 'converter-row';
                    const toGroup = document.createElement('div');
                    toGroup.className = 'converter-group';
                    const toLabel2 = document.createElement('label');
                    toLabel2.textContent = 'به:';
                    toGroup.appendChild(toLabel2);
                    const toSelect = document.createElement('select');
                    toSelect.id = `${cat}_to_select`;
                    toSelect.dataset.type = 'to';
                    toSelect.dataset.category = cat;
                    unitKeys.forEach(key => {
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.textContent = unitData.units[key].label;
                        if (key === state.toUnit && cat === state.category) opt.selected = true;
                        toSelect.appendChild(opt);
                    });
                    toGroup.appendChild(toSelect);
                    row2.appendChild(toGroup);

                    const spacer = document.createElement('div');
                    spacer.style.width = '48px';
                    row2.appendChild(spacer);
                    const empty = document.createElement('div');
                    row2.appendChild(empty);
                    section.appendChild(row2);
                    sectionsContainer.appendChild(section);
                });

                document.querySelectorAll('.converter-group select').forEach(sel => {
                    sel.addEventListener('change', function() {
                        const cat = this.dataset.category;
                        const type = this.dataset.type;
                        if (type === 'from') state.fromUnit = this.value;
                        else state.toUnit = this.value;
                        const input = document.getElementById(`${cat}_input`);
                        if (input) state.inputValue = parseFloat(input.value) || 0;
                        updateResult();
                        updateUnitReference(cat);
                    });
                });
            }

            function swapUnits(category) {
                const fromSelect = document.getElementById(`${category}_from_select`);
                const toSelect = document.getElementById(`${category}_to_select`);
                if (!fromSelect || !toSelect) return;
                const temp = fromSelect.value;
                fromSelect.value = toSelect.value;
                toSelect.value = temp;
                state.fromUnit = fromSelect.value;
                state.toUnit = toSelect.value;
                const input = document.getElementById(`${category}_input`);
                if (input) state.inputValue = parseFloat(input.value) || 0;
                updateResult();
                updateUnitReference(category);
            }

            function switchCategory(category) {
                state.category = category;
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.category === category);
                });
                document.querySelectorAll('.converter-section').forEach(section => {
                    section.classList.toggle('active', section.dataset.category === category);
                });
                const unitData = UNITS[category];
                const keys = Object.keys(unitData.units);
                if (keys.length >= 2) {
                    if (!unitData.units[state.fromUnit] || !unitData.units[state.toUnit]) {
                        state.fromUnit = keys[0];
                        state.toUnit = keys[1];
                        const fromSel = document.getElementById(`${category}_from_select`);
                        const toSel = document.getElementById(`${category}_to_select`);
                        if (fromSel) fromSel.value = keys[0];
                        if (toSel) toSel.value = keys[1];
                    }
                }
                const input = document.getElementById(`${category}_input`);
                if (input) state.inputValue = parseFloat(input.value) || 0;
                updateResult();
                updateUnitReference(category);
            }

            function updateUnitReference(category) {
                const unitData = UNITS[category];
                if (!unitData) return;
                const keys = Object.keys(unitData.units);
                const baseKey = unitData.baseUnit || keys[0];
                const baseLabel = unitData.units[baseKey]?.label || baseKey;
                let html = `<span class="ref-item">📌 واحد پایه: ${baseLabel}</span>`;
                const sampleKeys = keys.filter(k => k !== baseKey).slice(0, 5);
                sampleKeys.forEach(key => {
                    const factor = unitData.units[key].factor;
                    const label = unitData.units[key].label;
                    if (unitData.customConvert) {
                        html += `<span class="ref-item">🔹 ${label}</span>`;
                    } else {
                        const ratio = factor / (unitData.units[baseKey]?.factor || 1);
                        const displayRatio = Number.isInteger(ratio) ? ratio : parseFloat(ratio.toPrecision(4));
                        html += `<span class="ref-item">۱ ${baseLabel} = ${displayRatio} ${label}</span>`;
                    }
                });
                unitReference.innerHTML = html;
            }

            function setQuickValue(value) {
                const input = document.getElementById(`${state.category}_input`);
                if (input) {
                    input.value = value;
                    state.inputValue = value;
                    updateResult();
                }
            }

            function buildTabs() {
                const container = document.getElementById('categoryTabs');
                container.innerHTML = '';
                const categories = Object.keys(UNITS);
                const icons = {
                    length: '📐',
                    weight: '⚖️',
                    temperature: '🌡️',
                    area: '📐',
                    volume: '🧪',
                    speed: '🏃',
                    time: '⏱️',
                    storage: '💾',
                    pressure: ' ',
                    energy: '⚡',
                    angle: '📐'
                };
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = `tab-btn${cat === state.category ? ' active' : ''}`;
                    btn.dataset.category = cat;
                    btn.innerHTML = `${icons[cat] || '📌'} ${UNITS[cat].label}`;
                    btn.addEventListener('click', function() { switchCategory(cat); });
                    container.appendChild(btn);
                });
            }

            // Init
            state.category = 'length';
            state.fromUnit = 'meter';
            state.toUnit = 'centimeter';
            state.inputValue = 1;

            buildTabs();
            buildSections();
            updateResult();
            updateUnitReference('length');

            document.querySelectorAll('.q-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const val = parseFloat(this.dataset.value) || 0;
                    setQuickValue(val);
                });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type === 'number') {
                    e.preventDefault();
                    const val = parseFloat(e.target.value) || 0;
                    state.inputValue = val;
                    updateResult();
                }
            });

            console.log('📏 Unit Converter loaded!');
        })();
    </script>
</body>
</html>
