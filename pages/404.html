<!DOCTYPE html>
<html lang="fa" dir="rtl">
<script src="../auth/auth.js"></script>
<script src="../auth/header.js"></script>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه یافت نشد | نوینیکس</title>
    <link rel="icon" href="../assets/images/logo.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e8f5f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
        }
        .error-container {
            max-width: 600px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 0 60px rgba(0, 255, 204, 0.15);
        }
        .error-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #e8f5f0;
        }
        .error-text {
            color: #a0b4c8;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #00ffcc, #00b4db);
            color: #0f0c29;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.25);
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(0, 255, 204, 0.35);
        }
        .suggestion {
            margin-top: 30px;
            color: rgba(160, 180, 200, 0.5);
            font-size: 0.85rem;
        }
        .suggestion a {
            color: #00ffcc;
            text-decoration: none;
        }
        .suggestion a:hover {
            text-decoration: underline;
        }
        .emoji-big {
            font-size: 4rem;
            display: block;
            margin-bottom: 10px;
        }
        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="emoji-big">🔍</div>
        <div class="error-code">۴۰۴</div>
        <h1 class="error-title">اوه! صفحه‌ای که دنبالش هستی پیدا نشد</h1>
        <p class="error-text">
            ممکن است آدرس را اشتباه تایپ کرده باشید یا صفحه حذف شده باشد.
            <br />
            اما نگران نباش، می‌توانیم کمکت کنیم به مسیر درست برگردی!
        </p>
        <a href="../main.html" class="btn-home">🏠 بازگشت به خانه</a>
        <div class="suggestion">
            یا به <a href="../pages/online-tools.html">ابزارها</a>،
            <a href="../pages/games.html">بازی‌ها</a> یا
            <a href="../pages/education.html">آموزش‌ها</a> سر بزن
        </div>
    </div>
<script src="../assets/js/seo.js"></script>
</body>
</html>
