            // ===== متغیرهای صفحه‌بندی =====
            const ITEMS_PER_PAGE = 6;
            let currentPage = 1;
            let currentCategory = 'all';
            let currentSearch = '';
            let filteredArticles = [...articlesData];

            // ===== ذخیره در localStorage =====
            localStorage.setItem('novinix_blog_articles', JSON.stringify(articlesData));

            // ===== رندر مقالات =====
            function renderArticles() {
                const grid = document.getElementById('blogGrid');
                const noResults = document.getElementById('noResults');
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;
                const pageItems = filteredArticles.slice(start, end);

                if (filteredArticles.length === 0) {
                    grid.innerHTML = '';
                    noResults.style.display = 'block';
                    document.getElementById('paginationContainer').style.display = 'none';
                    return;
                }

                noResults.style.display = 'none';
                document.getElementById('paginationContainer').style.display = 'flex';

                if (pageItems.length === 0 && filteredArticles.length > 0) {
                    currentPage = 1;
                    renderArticles();
                    return;
                }

                let html = '';
                pageItems.forEach(article => {
                    const tagsHtml = article.tags.slice(0, 3).map(tag =>
                        `<span class="tag">#${tag}</span>`
                    ).join('');

                    const articleLink = `../blog/${article.slug}.html`;

                    html += `
                        <a href="${articleLink}" class="blog-card">
                            <div class="card-image">
                                <span class="no-img">${article.icon || '📄'}</span>
                                <span class="card-badge">${article.category}</span>
                            </div>
                            <div class="card-body">
                                <div class="meta">
                                    <span>👤 ${article.author}</span>
                                    <span>📅 ${article.date}</span>
                                    <span>⏱️ ${article.readTime}</span>
                                    <span>👁️ ${article.views.toLocaleString('fa-IR')}</span>
                                </div>
                                <h3>${article.title}</h3>
                                <p class="excerpt">${article.excerpt}</p>
                                <div class="tags">${tagsHtml}</div>
                                <span class="read-more">ادامه مطلب ←</span>
                            </div>
                        </a>
                    `;
                });

                grid.innerHTML = html;
                renderPagination();
            }

            // ===== رندر دکمه‌های صفحه‌بندی =====
            function renderPagination() {
                const totalPages = Math.ceil(filteredArticles.length / ITEMS_PER_PAGE);
                const pageNumbers = document.getElementById('pageNumbers');
                const prevBtn = document.getElementById('prevPage');
                const nextBtn = document.getElementById('nextPage');
                const pageInfo = document.getElementById('pageInfo');

                if (totalPages <= 1) {
                    pageNumbers.innerHTML = '';
                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'none';
                    pageInfo.textContent = '';
                    return;
                }

                prevBtn.style.display = 'inline-block';
                nextBtn.style.display = 'inline-block';
                prevBtn.disabled = (currentPage === 1);
                nextBtn.disabled = (currentPage === totalPages);
                pageInfo.textContent = `صفحه ${currentPage} از ${totalPages}`;

                let html = '';
                const maxVisible = 5;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                let endPage = Math.min(totalPages, startPage + maxVisible - 1);

                if (endPage - startPage < maxVisible - 1) {
                    startPage = Math.max(1, endPage - maxVisible + 1);
                }

                if (startPage > 1) {
                    html += `<button class="page-btn" data-page="1">۱</button>`;
                    if (startPage > 2) {
                        html += `<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>`;
                    }
                }

                for (let i = startPage; i <= endPage; i++) {
                    const activeClass = (i === currentPage) ? ' active' : '';
                    html += `<button class="page-btn${activeClass}" data-page="${i}">${i}</button>`;
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        html += `<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>`;
                    }
                    html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
                }

                pageNumbers.innerHTML = html;

                // ===== رویدادهای کلیک دکمه‌ها =====
                document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const page = parseInt(this.dataset.page);
                        goToPage(page);
                    });
                });
            }

            // ===== رفتن به صفحه مشخص =====
            function goToPage(page) {
                const totalPages = Math.ceil(filteredArticles.length / ITEMS_PER_PAGE);
                if (page < 1 || page > totalPages) return;
                currentPage = page;
                renderArticles();
                document.getElementById('blogGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ===== فیلتر و جستجو =====
            function handleSearchAndFilter() {
                const searchInput = document.getElementById('searchBlog');
                currentSearch = searchInput.value.toLowerCase().trim();

                let filtered = articlesData;

                if (currentCategory !== 'all') {
                    filtered = filtered.filter(a => a.category === currentCategory);
                }

                if (currentSearch) {
                    filtered = filtered.filter(a =>
                        a.title.toLowerCase().includes(currentSearch) ||
                        a.excerpt.toLowerCase().includes(currentSearch) ||
                        a.tags.some(tag => tag.toLowerCase().includes(currentSearch)) ||
                        a.author.toLowerCase().includes(currentSearch)
                    );
                }

                filteredArticles = filtered;
                currentPage = 1;
                renderArticles();
            }

            // ===== فیلتر دسته‌بندی =====
            function filterCategory(category, element) {
                document.querySelectorAll('.cat-tag').forEach(tag => tag.classList.remove('active'));
                if (element) element.classList.add('active');
                currentCategory = category;
                handleSearchAndFilter();
            }

            // ===== آمار =====
            function updateStats() {
                document.getElementById('totalArticles').textContent = articlesData.length;
                const totalViews = articlesData.reduce((sum, a) => sum + a.views, 0);
                document.getElementById('totalViews').textContent = totalViews.toLocaleString('fa-IR');
                const authors = [...new Set(articlesData.map(a => a.author))];
                document.getElementById('totalAuthors').textContent = authors.length;
            }

            // ===== رویدادها =====
            document.addEventListener('DOMContentLoaded', function() {
                filteredArticles = [...articlesData];
                renderArticles();
                updateStats();

                // جستجو
                document.getElementById('searchBlog').addEventListener('input', handleSearchAndFilter);

                // کلیک روی دسته‌بندی‌ها
                document.querySelectorAll('.cat-tag').forEach(tag => {
                    tag.addEventListener('click', function() {
                        const category = this.dataset.category;
                        filterCategory(category, this);
                    });
                });

                // دکمه‌های قبلی و بعدی
                document.getElementById('prevPage').addEventListener('click', function() {
                    if (currentPage > 1) goToPage(currentPage - 1);
                });

                document.getElementById('nextPage').addEventListener('click', function() {
                    const totalPages = Math.ceil(filteredArticles.length / ITEMS_PER_PAGE);
                    if (currentPage < totalPages) goToPage(currentPage + 1);
                });
            });

            // ===== در معرض دید global =====
            window.goToPage = goToPage;
            window.filterCategory = filterCategory;
            window.handleSearchAndFilter = handleSearchAndFilter;
            window.currentPage = currentPage;

            console.log('📝 Blog loaded!');
        })();
    </script>
